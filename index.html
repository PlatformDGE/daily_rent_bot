<html lang="ru">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;overflow-x:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:16px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
select option{background:#1c1c1e;color:#fff}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator,
input[type=month]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.4}

/* Layout */
#root{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px 90px}
.screen{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;z-index:50;overflow:hidden}
.screen>.page{padding-bottom:20px}

/* Header */
.hdr{background:#1c1c1e;border-bottom:1px solid rgba(255,255,255,.07);padding:13px 16px;flex-shrink:0}
.hdr-row{display:flex;align-items:center;gap:10px}

/* Tabs */
.tabs{display:flex;background:#111;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.tab{flex:1;padding:12px 4px;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.3);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
.tab.on{color:#fff;border-bottom-color:#fff}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,17,17,.96);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.07);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:rgba(255,255,255,.28);background:none;border:none;cursor:pointer}
.nav-btn.on{color:#fff}

/* Cards */
.card{background:#1c1c1e;border-radius:16px;overflow:hidden}
.pad{padding:14px 16px}
.bk-card{background:#1c1c1e;border-radius:16px;overflow:hidden;margin-bottom:10px}
.bk-main{padding:14px 16px;cursor:pointer}
.bk-main:active{background:rgba(255,255,255,.04)}
.bk-body{border-top:1px solid rgba(255,255,255,.06);padding:14px 16px;background:#161616}
.apt-card{background:#1c1c1e;border-radius:16px;overflow:hidden;margin-bottom:10px;cursor:pointer}
.apt-card:active{opacity:.85}

/* Owner bar on apt card */
.apt-top{padding:14px 16px 10px}
.apt-bot{padding:10px 16px;background:#161616;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between}

/* Forms */
.field{margin-bottom:13px}
.lbl{display:block;font-size:11px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.inp{width:100%;background:#2c2c2e;border:none;border-radius:12px;padding:12px 14px;font-size:16px;color:#fff;outline:none;-webkit-appearance:none}
.inp:focus{box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.inp::placeholder{color:rgba(255,255,255,.18)}
.inp.pl{padding-left:36px}
.inp.pr{padding-right:36px}
.sel{width:100%;background:#2c2c2e;border:none;border-radius:12px;padding:12px 14px;font-size:16px;color:#fff;outline:none;-webkit-appearance:none}
.rel{position:relative}
.il{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);pointer-events:none;font-size:14px;font-weight:700}
.ir{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);pointer-events:none;font-size:13px;font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;cursor:pointer;-webkit-appearance:none;border-radius:12px}
.btn:active{opacity:.6}
.btn-w{background:#fff;border:none;color:#000;padding:12px 18px;font-size:14px;font-weight:700}
.btn-g{background:#2c2c2e;border:none;color:#fff;padding:12px 18px;font-size:14px}
.btn-r{background:rgba(255,69,58,.12);border:none;color:#ff453a;padding:8px 13px;font-size:13px;border-radius:10px}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn-green{width:100%;background:rgba(52,199,89,.15);border:none;color:#34c759;padding:14px;font-size:15px;font-weight:700;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px}
.fab-bar{background:#1c1c1e;border-top:1px solid rgba(255,255,255,.07);padding:13px 16px;padding-bottom:max(13px,env(safe-area-inset-bottom));flex-shrink:0}
.fab{width:100%;background:#fff;border:none;color:#000;border-radius:14px;padding:15px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.fab:active{opacity:.7}

/* Badges */
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.b-g{background:rgba(52,199,89,.15);color:#34c759}
.b-gy{background:rgba(142,142,147,.15);color:#8e8e93}
.b-or{background:rgba(255,149,0,.15);color:#ff9500}
.b-bl{background:rgba(10,132,255,.15);color:#0a84ff}
.b-rd{background:rgba(255,69,58,.15);color:#ff453a}
.b-yw{background:rgba(255,214,10,.12);color:#ffd60a}

/* Segment pickers */
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg-btn{flex:1;min-width:70px;padding:11px 8px;border-radius:12px;font-size:14px;font-weight:600;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer;text-align:center}
.seg-btn.s-a{background:rgba(255,149,0,.15);color:#ff9500}
.seg-btn.s-b{background:rgba(10,132,255,.15);color:#0a84ff}
.seg-btn.s-o{background:rgba(142,142,147,.15);color:#8e8e93}
.seg-btn.s-on{background:rgba(255,255,255,.12);color:#fff}

/* Currency toggle */
.cur-seg{display:flex;gap:6px}
.cur-btn{flex:1;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:700;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer;text-align:center}
.cur-btn.c-usd{background:rgba(255,214,10,.12);color:#ffd60a}
.cur-btn.c-gel{background:rgba(52,199,89,.12);color:#34c759}

/* Payer toggle */
.pay-seg{display:flex;gap:8px}
.pay-btn{flex:1;padding:10px 6px;border-radius:10px;font-size:13px;font-weight:600;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer;text-align:center}
.pay-btn.p-on{background:rgba(10,132,255,.15);color:#0a84ff}

/* Status buttons */
.st-seg{display:flex;gap:6px}
.st-btn{flex:1;padding:10px 6px;border-radius:10px;font-size:12px;font-weight:600;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer;text-align:center}
.st-btn.st-free{background:rgba(52,199,89,.15);color:#34c759}
.st-btn.st-busy{background:rgba(255,69,58,.15);color:#ff453a}
.st-btn.st-clean{background:rgba(255,214,10,.12);color:#ffd60a}
.st-btn.st-tech{background:rgba(142,142,147,.15);color:#8e8e93}

/* Calc box */
.cbox{background:#161616;border-radius:13px;overflow:hidden;margin-bottom:12px}
.crow{display:flex;justify-content:space-between;align-items:center;padding:9px 14px}
.crow.ind{padding-left:26px}
.crow.hi{background:#1c1c1e}
.cl{font-size:13px;color:rgba(255,255,255,.4)}
.cv{font-size:13px;font-weight:700;color:#fff}
.cv.neg{color:#ff453a}.cv.pos{color:#34c759}.cv.blu{color:#0a84ff}.cv.big{font-size:16px}
.cdiv{height:1px;background:rgba(255,255,255,.06)}

/* Lang toggle */
.lang-btn{padding:8px 14px;border-radius:10px;font-size:13px;font-weight:600;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer}
.lang-btn.on{background:rgba(10,132,255,.15);color:#0a84ff}

/* Report */
.rpt-box{background:#161616;border-radius:12px;padding:14px;font-size:12px;line-height:1.85;color:rgba(255,255,255,.7);white-space:pre-wrap;word-break:break-word;font-family:monospace}

/* Misc */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.f1{flex:1;min-width:0}.fs0{flex-shrink:0}
.tr{text-align:right}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu{color:rgba(255,255,255,.35);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.empty{text-align:center;padding:48px 16px;color:rgba(255,255,255,.2);font-size:15px;line-height:1.6}
.sec{font-size:11px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.div{height:1px;background:rgba(255,255,255,.07);margin:14px 0}
.night-pill{text-align:center;background:#2c2c2e;border-radius:12px;padding:10px;color:rgba(255,255,255,.7);font-size:15px;font-weight:600;margin-bottom:13px}
.hrs-block{background:#2c2c2e;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.exp-block{background:#1c1c1e;border-radius:13px;padding:13px 14px;margin-bottom:10px}
.sync-bar{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12px;flex-shrink:0}
.sy-ok{background:rgba(52,199,89,.07);border-bottom:1px solid rgba(52,199,89,.12);color:#34c759}
.sy-er{background:rgba(255,69,58,.07);border-bottom:1px solid rgba(255,69,58,.12);color:#ff453a}
.sy-ld{background:rgba(10,132,255,.07);border-bottom:1px solid rgba(10,132,255,.12);color:#0a84ff}
.owner-strip{display:flex;align-items:center;gap:10px;background:#1c1c1e;border-radius:12px;padding:11px 14px;margin-top:10px}
.ow-av{width:30px;height:30px;border-radius:50%;background:#2c2c2e;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.rate-pill{display:flex;align-items:center;gap:5px;background:#2c2c2e;border-radius:10px;padding:6px 11px}
.cur-block{border-radius:14px;overflow:hidden;margin-bottom:10px}
.cur-hdr{padding:9px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.cur-row{display:flex;justify-content:space-between;padding:8px 14px;font-size:13px;border-top:1px solid rgba(255,255,255,.06)}
.total-bar{background:#1c1c1e;border-radius:14px;padding:13px 14px;margin-bottom:12px}
.clean-card{background:#1c1c1e;border-radius:13px;padding:13px 14px;margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .9s linear infinite;display:inline-block}
.paid-bar{padding:10px 14px;background:rgba(52,199,89,.1);border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-top:10px}

function fD(d){if(!d)return"—";var s=String(d).slice(0,10);return new Date(s+"T12:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit"});}

var LOCAL_APT_KEYS=["status","util_rates","platform_pct","platforms","mapLink","notes","owner_account","owner_contact"];
var LOCAL_BK_KEYS=["paid_out","paid_out_at","assigned_staff","income_currency","tax_pct","booking_fee","platform_pct","comment"];

function syncFull(){
  DB.syncState="loading"; renderSyncBar();
  return apiGet().then(function(data){
    // Smart merge: Sheets wins on base fields, local wins on ephemeral fields
    DB.apts = (data.apartments||[]).map(function(a){
      var id=String(a.id||a.apartment_id||uid());
      var loc=DB.apts.find(function(x){return x.id===id;});
      var m=Object.assign({},a,{id:id});
      if(loc) LOCAL_APT_KEYS.forEach(function(f){if(loc[f]!==undefined&&loc[f]!==""&&(m[f]===undefined||m[f]===""))m[f]=loc[f];});
      return m;
    });
    DB.bookings=(data.bookings||[]).map(function(b){
      var id=String(b.id||uid());
      var loc=DB.bookings.find(function(x){return x.id===id;});
      var m=Object.assign({},b,{id:id});
      if(loc){
        LOCAL_BK_KEYS.forEach(function(f){if(loc[f]!==undefined&&loc[f]!==""&&(m[f]===undefined||m[f]===""))m[f]=loc[f];});
        if(loc.paid_out===true){m.paid_out=true;m.paid_out_at=loc.paid_out_at;}
      }
      return m;
    });
    DB.expenses=(data.expenses||[]).map(function(e){return Object.assign({},e,{id:String(e.id||uid())});});
    // Clean orphaned expenses (no valid booking_id)
    var validBkIds=DB.bookings.map(function(b){return String(b.id);});
    DB.expenses=DB.expenses.filter(function(e){
      return e.booking_id&&e.booking_id!==""&&e.booking_id!=="undefined"&&validBkIds.indexOf(String(e.booking_id))>-1;
    });
    DB.cleaning=(data.cleaning||[]).map(function(c){return Object.assign({},c,{id:String(c.id||uid())});});
    DB.staff=(data.staff||[]).map(function(s){return Object.assign({},s,{id:String(s.id||uid())});});
    if(data.rate)DB.rate=data.rate;
    DB.syncState="ok";
    DB.syncTime=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    dbSave();
  }).catch(function(e){
    DB.syncState="err";console.error(e);
  }).then(function(){renderSyncBar();});
}

function renderSyncBar(){
  var bar=g("sync-bar");if(!bar)return;
  if(DB.syncState==="loading"){bar.className="sync-bar sy-ld";bar.innerHTML='<span class="spin">⟳</span> Синхронизация...';}
  else if(DB.syncState==="ok"){bar.className="sync-bar sy-ok";bar.innerHTML='✓ '+t("synced")+' · '+DB.syncTime+' · 1$=₾'+fN(DB.rate);}
  else if(DB.syncState==="err"){bar.className="sync-bar sy-er";bar.innerHTML=t("syncErr")+' <button onclick="syncFull()" style="background:none;border:none;color:#ff453a;cursor:pointer;font-size:12px;text-decoration:underline;margin-left:6px">'+t("retry")+'</button>';}
  else{bar.className="sync-bar";bar.innerHTML="";}
}

function pushBg(action,data){
  var n=0;function go(){n++;apiPost(action,data).catch(function(){if(n<3)setTimeout(go,3000);});}go();
}

function calcBk(bk){
  var rate=DB.rate;
  var plat=bk.platform||"Airbnb";
  var cur=bk.income_currency||(plat==="Airbnb"?"USD":"GEL");  var gross=parseFloat(bk.gross_income)||0;
  var taxPct=parseFloat(bk.tax_pct)||0;
  var tax=parseFloat((gross*taxPct/100).toFixed(2));
  var afterTax=parseFloat((gross-tax).toFixed(2));
  var bookFee=plat==="Booking"?(parseFloat(bk.booking_fee)||0):0;
  var exps=DB.expenses.filter(function(e){
    if(!e.booking_id||e.booking_id===""||e.booking_id==="undefined")return false;
    if(String(e.booking_id)!==String(bk.id))return false;
    // Skip expenses with invalid amounts (date strings, etc)
    var v=parseFloat(e.amount);
    if(isNaN(v)||v<0||v>50000)return false;
    var raw=String(e.amount||"");
    if(raw.includes("T")||raw.includes("-20"))return false;
    return true;
  }).map(function(e){
    var amt=parseFloat(e.amount)||0;
    var inB=cur==="USD"?(e.currency==="USD"?amt:parseFloat((amt/rate).toFixed(2))):(e.currency==="GEL"?amt:parseFloat((amt*rate).toFixed(2)));
    return Object.assign({},e,{amt:amt,inB:inB});
  });
  var totalExp=parseFloat(exps.reduce(function(s,e){return s+e.inB;},0).toFixed(2));
  var net=parseFloat((afterTax-totalExp-bookFee).toFixed(2));
  var dPct=parseFloat(bk.platform_pct)||20;
  var oPct=100-dPct;
  var dBase=parseFloat((net*dPct/100).toFixed(2));
  var oBase=parseFloat((net*oPct/100).toFixed(2));
  var expPlat=parseFloat(exps.filter(function(e){return e.payer==="platform";}).reduce(function(s,e){return s+e.inB;},0).toFixed(2));
  var expOwn=parseFloat(exps.filter(function(e){return e.payer==="owner";}).reduce(function(s,e){return s+e.inB;},0).toFixed(2));
  var dFin=parseFloat((dBase+expPlat+bookFee).toFixed(2));
  var oFin=parseFloat((oBase+expOwn).toFixed(2));
  return{gross:gross,tax:tax,taxPct:taxPct,bookFee:bookFee,exps:exps,totalExp:totalExp,
    net:net,dPct:dPct,oPct:oPct,dBase:dBase,oBase:oBase,dFin:dFin,oFin:oFin,
    cur:cur,plat:plat,
    netUSD:toUSD(net,cur,rate),dFinUSD:toUSD(dFin,cur,rate),oFinUSD:toUSD(oFin,cur,rate)};
}

var EXP_LBL_KA={cleaning:"დასუფთავება",telmico:"💧 Telmico",gwp:"🔥 GWP",energy:"⚡ Tbilisi Energy",internet:"🌐 Internet",tbilisi_clean:"🗑 Tbilisi Clean",supplies:"მასალები",repair:"რემონტი",other:"სხვა"};

function makeReport(apt,bk,c,lng){
  lng=lng||"ru";var L=TR[lng]||TR.ru;
  var S=function(v){return cs(c.cur)+fN(v);};
  var n=nts(bk.check_in,bk.check_out);
  var nLabel=lng==="ka"?n+" ღამე":nL(n);
  var lbl=lng==="ka"?EXP_LBL_KA:EXP_LABELS;

  // Expense lines with payer label
  var expLines=c.exps.filter(function(e){return e.inB>0;}).map(function(e){
    var name=(lbl[e.category||e.cat]||e.category||e.cat)+(e.provider?" "+e.provider:"");
    var payerLabel=e.payer==="owner"?" ["+L.byOwn+"]":" ["+L.byPlat+"]";
    return"   • "+name+": "+cs(e.currency)+fN(e.amt)+payerLabel+(e.comment?" ("+e.comment+")":"");
  });

  // Distribution with compensation detail
  var distLines=[];
  // Platform share (David)
  distLines.push("👤 "+L.rptPlat+" ("+c.dPct+"%):");
  distLines.push("   "+S(c.net)+" × "+c.dPct+"% = "+S(c.dBase));
  if(c.expPlat>0) distLines.push("   + "+L.compPlat+": "+S(c.expPlat));
  if(c.bookFee>0) distLines.push("   + Booking fee: "+S(c.bookFee));
  distLines.push("   = "+S(c.dFin));
  distLines.push("");
  // Owner share
  var ownerName=apt?apt.owner_name||L.rptOwn:L.rptOwn;
  distLines.push("🏦 "+ownerName+" ("+c.oPct+"%):");
  distLines.push("   "+S(c.net)+" × "+c.oPct+"% = "+S(c.oBase));
  if(c.expOwn>0) distLines.push("   + "+L.compOwn+": "+S(c.expOwn));
  distLines.push("   = "+S(c.oFin));

  return[
    "🏠 "+(apt?apt.apartment_name:"—"),
    apt&&apt.address?"📍 "+apt.address+", Tbilisi":null,"",
    "📅 "+L.rptP+": "+fDl(bk.check_in,lng)+" — "+fDl(bk.check_out,lng)+" ("+nLabel+")",
    bk.guest_name?"👤 "+L.rptG+": "+bk.guest_name:null,
    "📱 "+L.rptPl+": "+c.plat,"",
    "💰 "+L.rptArr+": "+S(c.gross),
    c.tax>0?"📉 "+L.rptTax+" ("+c.taxPct+"%): -"+S(c.tax):null,
    c.bookFee>0?"📉 Booking fee: -"+S(c.bookFee):null,
    c.totalExp>0?"🔧 "+L.rptExp+": -"+S(c.totalExp):null,
  ].concat(expLines).concat([
    "","✅ "+L.rptNet+": "+S(c.net),"",
  ]).concat(distLines).concat([
    apt&&apt.owner_account?"\n🏦 "+L.rptAcc+": "+apt.owner_account:null,
    bk.comment?"\n💬 "+bk.comment:null,
  ]).filter(function(l){return l!==null;}).join("\n");
}

  lsSet("ob_step",0);
  renderOnboarding();
};

window.obNext=function(step,lng){
  var TR=OB_TR[lng]||OB_TR.en;
  var isLast=step===TR.steps.length-1;
  if(isLast){
    var el=g("ob-sid");
    var raw=el?el.value.trim():"";
    var m=raw.match(/\/spreadsheets\/d\/([a-zA-Z0-9_-]+)/);
    var id=m?m[1]:raw;
    if(!id){
      if(el){el.focus();el.style.boxShadow="0 0 0 2px #ff453a";}
      return;
    }
    lsSet("sheet_id",id);
    lsSet("onboarded",true);
    lsSet("ob_step",0);
    render();syncFull();
  } else {
    lsSet("ob_step",step+1);
    renderOnboarding();
  }
};
window.obBack=function(step){
  if(step===0){lsSet("ob_lang","");renderLangPicker();}
  else{lsSet("ob_step",step-1);renderOnboarding();}
};

/* ─── HOME SCREEN ─── */
function renderHome(){
  var today=new Date().toISOString().slice(0,10);
  var soon=new Date();soon.setDate(soon.getDate()+7);
  var soonStr=soon.toISOString().slice(0,10);
  var apts=DB.apts.filter(function(a){return a.id&&a.apartment_name;});
  if(!apts.length)return'<div class="empty">'+t("noApts")+'</div>';

  var activeCount=DB.bookings.filter(function(b){
    var ci=b.check_in&&b.check_in.slice(0,10);
    var co=b.check_out&&b.check_out.slice(0,10);
    return ci&&co&&ci<=today&&co>today;
  }).length;
  var upcomingCount=DB.bookings.filter(function(b){
    var ci=b.check_in&&b.check_in.slice(0,10);
    return ci&&ci>today&&ci<=soonStr;
  }).length;
  var unpaidTotal=DB.bookings.filter(function(b){return!b.paid_out;}).reduce(function(s,b){return s+calcBk(b).oFinUSD;},0);

  var html=
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px">'+
      mkStatTile(String(activeCount),"Заняты сейчас","#34c759")+
      mkStatTile(String(upcomingCount),"Скоро заедут","#ffd60a")+
      mkStatTile(unpaidTotal>0?"$"+fN(unpaidTotal):"✓","К выплате",unpaidTotal>0?"#ff9500":"#34c759")+
    '</div>';

  html+=apts.map(function(apt){
    var abs=DB.bookings.filter(function(b){return String(b.apartment_id)===String(apt.id);})
      .sort(function(a,b){
        // paid_out goes to bottom
        if(a.paid_out&&!b.paid_out)return 1;
        if(!a.paid_out&&b.paid_out)return -1;
        // then by check_in descending
        return new Date(b.check_in)-new Date(a.check_in);
      })
      .slice(0,5);
    if(!abs.length){
      return'<div style="margin-bottom:16px">'+aptRowHdr(apt,today)+'<div onclick="goAptNewBk(\''+apt.id+'\')" style="background:#1c1c1e;border-radius:12px;padding:12px;text-align:center;color:rgba(255,255,255,.25);font-size:13px;cursor:pointer">+ Добавить первое проживание</div></div>';
    }
    return'<div style="margin-bottom:20px">'+
      aptRowHdr(apt,today)+
      '<div style="display:flex;flex-direction:column;gap:6px">'+
        abs.map(function(bk){return bkTile(bk,today,soonStr);}).join("")+
        '<div onclick="goAptNewBk(\''+apt.id+'\')" style="background:none;border:1px dashed rgba(255,255,255,.1);border-radius:12px;padding:10px;text-align:center;color:rgba(255,255,255,.25);font-size:13px;cursor:pointer">+ Добавить проживание</div>'+
      '</div>'+
    '</div>';
  }).join("");
  return html;
}

function mkStatTile(val,lbl,color){
  return'<div style="background:#1c1c1e;border-radius:14px;padding:12px 10px;text-align:center">'+
    '<div style="font-size:20px;font-weight:700;color:'+color+';letter-spacing:-.3px">'+val+'</div>'+
    '<div class="mu" style="font-size:10px;margin-top:3px">'+lbl+'</div>'+

}

function aptRowHdr(apt,today){
  var stColors={free:"#34c759",busy:"#ff453a",clean:"#ffd60a",tech:"#8e8e93"};
  var status=apt.status||"free";
  return'<div onclick="goApt(\''+apt.id+'\')" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer;padding:2px 0">'+
    '<div style="display:flex;align-items:center;gap:8px">'+
      '<div style="width:8px;height:8px;border-radius:50%;background:'+(stColors[status]||"#34c759")+';flex-shrink:0"></div>'+
      '<span style="font-size:15px;font-weight:600;letter-spacing:-.2px">'+apt.apartment_name+'</span>'+
    '</div>'+
    '<div style="display:flex;align-items:center;gap:8px">'+
      (apt.owner_name?'<span class="mu" style="font-size:12px">'+apt.owner_name+'</span>':"")+
      '<span style="color:rgba(255,255,255,.25);font-size:20px;line-height:1">›</span>'+
    '</div>'+
  '</div>';
}

function bkColor(bk){
  // 3 states: pending=blue, received+unpaid=orange, paid_out=green
  if(bk.paid_out)return{accent:"#34c759",bg:"rgba(52,199,89,.04)",label:"",labelColor:""};
  if(bk.payment_status==="pending"||bk.payment_status==="")return{accent:"#0a84ff",bg:"rgba(10,132,255,.05)",label:"Не получено",labelColor:"#0a84ff"};
  if(bk.payment_status==="partial")return{accent:"#ffd60a",bg:"rgba(255,214,10,.05)",label:"Частично",labelColor:"#ffd60a"};
  // received but not paid to owner
  return{accent:"#ff9500",bg:"rgba(255,149,0,.05)",label:"Не выплачено",labelColor:"#ff9500"};
}

function bkTile(bk,today,soonStr){
  var c=calcBk(bk);
  var ci=bk.check_in&&bk.check_in.slice(0,10);
  var co=bk.check_out&&bk.check_out.slice(0,10);
  var isNow=ci&&co&&ci<=today&&co>today;
  var isSoon=ci&&ci>today&&ci<=soonStr;
  var col=bkColor(bk);
  var opacity=bk.paid_out?"opacity:0.5;":"";
  return'<div onclick="goAptBk(\''+bk.apartment_id+'\',\''+bk.id+'\')" style="'+opacity+'background:'+col.bg+';border-radius:12px;padding:12px 14px;cursor:pointer;border-left:3px solid '+col.accent+';display:flex;align-items:center;gap:12px">'+
    '<div style="flex:1;min-width:0">'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap">'+
        '<span style="font-size:13px;font-weight:600">'+(bk.guest_name||"—")+'</span>'+
        (isNow?'<span style="font-size:10px;background:rgba(52,199,89,.15);color:#34c759;padding:2px 7px;border-radius:99px;font-weight:700">● Сейчас</span>':"")+
        (isSoon?'<span style="font-size:10px;background:rgba(255,214,10,.12);color:#ffd60a;padding:2px 7px;border-radius:99px;font-weight:600">Скоро</span>':"")+
        (col.label?'<span style="font-size:10px;color:'+col.labelColor+';padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.2)">'+col.label+'</span>':"")+
        (bk.paid_out?'<span style="font-size:10px;color:#34c759">💸</span>':"")+
      '</div>'+
      '<div class="mu" style="font-size:11px">'+fD(bk.check_in)+' — '+fD(bk.check_out)+'</div>'+
    '</div>'+
    '<div style="text-align:right;flex-shrink:0">'+
      '<div style="font-size:14px;font-weight:700;color:'+(bk.paid_out?"rgba(255,255,255,.4)":"#fff")+'">'+cs(c.cur)+fN(c.gross)+'</div>'+
      '<div style="font-size:12px;font-weight:600;color:'+(bk.paid_out?"#34c759":col.accent)+'">'+
        (bk.paid_out?"✓ выплачено":cs(c.cur)+fN(c.oFin)+" ?")+
      '</div>'+
    '</div>'+
  '</div>';
}

/* ─── DASH ─── */
function renderDash(){
  var fil=DB.bookings.filter(function(b){
    if(V.dashApt!=="all"&&String(b.apartment_id)!==V.dashApt)return false;
    if(V.dashMonth&&(b.check_in||"").slice(0,7)!==V.dashMonth)return false;
    return true;
  });
  var uBks=fil.filter(function(b){return (b.income_currency||"USD")==="USD";});
  var gBks=fil.filter(function(b){return b.income_currency==="GEL";});
  function totals(arr){return arr.reduce(function(acc,b){var c=calcBk(b);return{gross:acc.gross+c.gross,net:acc.net+c.net,plat:acc.plat+c.dFin,own:acc.own+c.oFin,netUSD:acc.netUSD+c.netUSD,ownUSD:acc.ownUSD+c.oFinUSD};},{gross:0,net:0,plat:0,own:0,netUSD:0,ownUSD:0});}
  var tU=totals(uBks),tG=totals(gBks);
  var opts='<option value="all">'+t("allApts")+'</option>'+DB.apts.map(function(a){return'<option value="'+a.id+'"'+(V.dashApt===a.id?" selected":"")+'>'+a.apartment_name+'</option>';}).join("");
  function curBlock(bks,tots,sym,color,label){
    if(!bks.length)return"";
    return'<div class="cur-block" style="background:#1c1c1e;border-top:3px solid '+color+'">'+
      '<div class="cur-hdr" style="color:'+color+'">'+label+' — '+bks.length+' '+t("stays")+'</div>'+
      mkCR(t("arrived"),sym+fN(tots.gross),"#fff")+
      mkCR(t("net"),sym+fN(tots.net),"#34c759")+
      mkCR(t("platform"),sym+fN(tots.plat),"#0a84ff")+
      mkCR(t("owner"),sym+fN(tots.own),"#34c759")+
    '</div>';
  }
  var totalUSD="";
  if(uBks.length&&gBks.length){
    var tNet=tU.netUSD+tG.netUSD;var tOwn=tU.ownUSD+tG.ownUSD;
    totalUSD='<div class="total-bar">'+
      '<div class="sec" style="margin-bottom:10px">'+t("totalUSD")+' ('+t("byRate")+' '+fN(DB.rate)+')</div>'+
      mkCR(t("net"),"$"+fN(tNet),"#34c759")+
      mkCR(t("owner"),"$"+fN(tOwn),"#34c759")+
    '</div>';
  }
  var aptRows=DB.apts.map(function(apt){
    var ab=fil.filter(function(b){return String(b.apartment_id)===String(apt.id);});
    if(!ab.length)return"";
    var uA=ab.filter(function(b){return (b.income_currency||"USD")==="USD";});
    var gA=ab.filter(function(b){return b.income_currency==="GEL";});
    var tUa=totals(uA),tGa=totals(gA);
    var totalNetUSD=parseFloat((tUa.netUSD+tGa.netUSD).toFixed(2));
    var totalOwnUSD=parseFloat((tUa.ownUSD+tGa.ownUSD).toFixed(2));
    var unpaidOwn=ab.filter(function(b){return!b.paid_out;}).reduce(function(s,b){return s+calcBk(b).oFinUSD;},0);
    var paidOwn=ab.filter(function(b){return b.paid_out;}).reduce(function(s,b){return s+calcBk(b).oFinUSD;},0);

    // Booking rows sorted newest first
    var sorted=ab.slice().sort(function(a,b){return new Date(b.check_in)-new Date(a.check_in);});
    var bkRows=sorted.map(function(bk){
      var c=calcBk(bk);
      var sym=cs(c.cur);
      var dates=fD(bk.check_in)+" — "+fD(bk.check_out);
      var guest=bk.guest_name||"—";
      return'<div style="display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-top:1px solid rgba(255,255,255,.05)">'+
        '<div style="min-width:0">'+
          '<div style="font-size:13px;font-weight:600;color:#fff">'+guest+'</div>'+
          '<div style="font-size:11px;color:rgba(255,255,255,.35);margin-top:2px">'+dates+' · '+platBdg(bk.platform)+'</div>'+
        '</div>'+
        '<div style="text-align:right;flex-shrink:0;margin-left:10px">'+
          '<div style="font-size:13px;font-weight:700;color:#34c759">$'+fN(c.oFinUSD)+'</div>'+
          (bk.paid_out?'<div style="font-size:10px;color:#34c759">✓ выплачено</div>':'<div style="font-size:10px;color:#ff9500">к выплате</div>')+
        '</div>'+
      '</div>';
    }).join("");

    return'<div class="card" style="margin-bottom:10px">'+
      // Header
      '<div class="pad" style="border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center">'+
        '<span style="font-size:15px;font-weight:600;letter-spacing:-.2px">'+apt.apartment_name+'</span>'+
        '<span style="font-size:13px;font-weight:700;color:#34c759;letter-spacing:-.2px">$'+fN(totalNetUSD)+'</span>'+
      '</div>'+
      // Mini stats row
      '<div style="display:flex;border-bottom:1px solid rgba(255,255,255,.06)">'+
        '<div style="flex:1;padding:10px 14px;border-right:1px solid rgba(255,255,255,.06)">'+
          '<div class="mu" style="font-size:10px;margin-bottom:2px">'+t("toPay")+'</div>'+
          '<div style="font-size:14px;font-weight:700;color:'+(unpaidOwn>0?"#ff9500":"#34c759")+'">'+(unpaidOwn>0?"$"+fN(unpaidOwn):"✓")+'</div>'+
        '</div>'+
        '<div style="flex:1;padding:10px 14px;border-right:1px solid rgba(255,255,255,.06)">'+
          '<div class="mu" style="font-size:10px;margin-bottom:2px">Выплачено</div>'+
          '<div style="font-size:14px;font-weight:700;color:#8e8e93">$'+fN(paidOwn)+'</div>'+
        '</div>'+
        '<div style="flex:1;padding:10px 14px">'+
          '<div class="mu" style="font-size:10px;margin-bottom:2px">Платформе</div>'+
          '<div style="font-size:14px;font-weight:700;color:#0a84ff">$'+fN(parseFloat((totalNetUSD-totalOwnUSD).toFixed(2)))+'</div>'+
        '</div>'+
      '</div>'+
      // Booking list
      bkRows+
    '</div>';
  }).join("");
  return'<div class="field"><select class="sel" onchange="V.dashApt=this.value;render()">'+opts+'</select></div>'+
    '<div class="field"><input type="month" class="inp" value="'+V.dashMonth+'" onchange="V.dashMonth=this.value;render()"/></div>'+
    curBlock(uBks,tU,"$","#ffd60a","USD")+
    curBlock(gBks,tG,"₾","#34c759","GEL")+
    totalUSD+
    (aptRows?'<div class="sec" style="margin-top:16px;margin-bottom:8px">По каждой квартире</div>'+aptRows:"")+
    (!fil.length?'<div class="empty">'+t("noData")+'</div>':"");
}

  var uBks=abs.filter(function(b){return (b.income_currency||"USD")==="USD";});

window.setAptStatus=function(st){
  var apt=getApt(V.aptId);if(!apt)return;
  apt.status=st;
  var i=DB.apts.findIndex(function(a){return String(a.id)===String(apt.id);});
  if(i>-1)DB.apts[i]=apt;
  dbSave();renderAptScreen();
  pushBg("upsert_apt",apt);
};
window.copyRpt=function(id){
  var d=window._RPT&&window._RPT[id];if(!d)return;
  navigator.clipboard.writeText(makeReport(d.apt,d.bk,d.c,V.rptLang)).catch(function(){});
  var btn=g("cp-"+id);if(btn){btn.innerHTML=I.check+" "+t("copied");setTimeout(function(){if(g("cp-"+id))g("cp-"+id).innerHTML=I.copy+" "+t("copyRpt");},2000);}
};
window.setPaidOut=function(id,val){
  var bk=DB.bookings.find(function(b){return b.id===id;});if(!bk)return;
  bk.paid_out=val;bk.paid_out_at=val?new Date().toISOString().slice(0,10):"";
  var i=DB.bookings.findIndex(function(b){return b.id===id;});if(i>-1)DB.bookings[i]=bk;
  dbSave();renderAptScreen();pushBg("upsert_booking",bk);
};
window.addExpInline=function(bkId,cat){
  var bk=DB.bookings.find(function(b){return b.id===bkId;});
  var defCur=(bk&&bk.income_currency)||"GEL";
  var e={id:uid(),booking_id:bkId,apartment_id:bk?bk.apartment_id:"",category:cat,amount:"",currency:defCur,payer:"platform",comment:"",date:new Date().toISOString().slice(0,10)};
  DB.expenses.push(e);
  dbSave();
  V.editingExps=bkId;
  // Save scroll position, rerender, restore
  var pg=document.querySelector(".page");
  var st=pg?pg.scrollTop:0;
  renderAptScreen();
  var pg2=document.querySelector(".page");
  if(pg2)pg2.scrollTop=st;
};
window.updExpField=function(id,field,val){
  var e=DB.expenses.find(function(x){return x.id===id;});
  if(!e)return;
  e[field]=val;
  dbSave();
  // Only rerender for button fields - preserve scroll for text inputs
  if(field==="currency"||field==="payer"){
    var pg=document.querySelector(".modal .page")||document.querySelector(".page");
    var st=pg?pg.scrollTop:0;
    renderAptScreen();
    setTimeout(function(){
      var pg2=document.querySelector(".modal .page")||document.querySelector(".page");
      if(pg2)pg2.scrollTop=st;
    },0);
  }
};

window.delExpFromDetail=function(expId,bkId){
  if(!confirm("Удалить расход?"))return;
  DB.expenses=DB.expenses.filter(function(e){return e.id!==expId;});
  dbSave();
  apiDel("delete_expense",expId);
  var pg=document.querySelector(".modal .page")||document.querySelector(".page");
  var st=pg?pg.scrollTop:0;
  renderAptScreen();
  setTimeout(function(){
    var pg2=document.querySelector(".modal .page")||document.querySelector(".page");
    if(pg2)pg2.scrollTop=st;
  },0);
};
window.saveExpEdits=function(bkId){
  var exps=DB.expenses.filter(function(e){return String(e.booking_id)===String(bkId);});
  dbSave();
  exps.forEach(function(e){pushBg("upsert_expense",e);});
  // Show brief confirmation without closing or scrolling
  var btn=document.querySelector("[onclick=\"saveExpEdits('"+bkId+"')\"]");
  if(btn){
    var orig=btn.innerHTML;
    btn.innerHTML="✓ Сохранено!";
    btn.style.background="#1a7a35";
    setTimeout(function(){if(btn){btn.innerHTML=orig;btn.style.background="#34c759";}},1500);
  }
};
window.doDelBk=function(id){
  if(!confirm("Удалить проживание?"))return;
  DB.bookings=DB.bookings.filter(function(b){return b.id!==id;});
  DB.expenses=DB.expenses.filter(function(e){return e.booking_id!==id;});
  dbSave();delete V.expOpen[id];renderAptScreen();
  apiDel("delete_booking",id);
};
window.goNewBk=function(){V.editBkId=null;BKF=null;_bkTab="main";V.screen="bkform";render();};

function calcBox(c,own){
  var C=cs(c.cur);
  var er=c.exps.filter(function(e){return e.inB>0;}).map(function(e){
    var n=(EXP_LABELS[e.category||e.cat]||e.category||e.cat)+(e.provider?" "+e.provider:"");
    return'<div class="crow ind"><span class="cl">• '+n+'</span><span class="cv neg">-'+cs(e.currency)+fN(e.amt)+'</span></div>';
  }).join("");
  return'<div class="cbox">'+
    '<div class="crow"><span class="cl">'+t("arrived")+'</span><span class="cv">'+C+fN(c.gross)+'</span></div>'+
    (c.tax>0?'<div class="crow"><span class="cl">'+t("tax")+'</span><span class="cv neg">-'+C+fN(c.tax)+'</span></div>':"")+
    (c.bookFee>0?'<div class="crow"><span class="cl">Booking fee</span><span class="cv neg">-'+C+fN(c.bookFee)+'</span></div>':"")+
    er+'<div class="cdiv"></div>'+
    '<div class="crow hi"><span class="cl" style="font-weight:600;color:#fff">'+t("net")+'</span><span class="cv big '+(c.net>=0?"pos":"neg")+'">'+C+fN(c.net)+'</span></div>'+
    '<div class="cdiv"></div>'+
    '<div class="crow ind"><span class="cl">'+t("platform")+' ('+c.dPct+'%)</span><span class="cv blu">'+C+fN(c.dFin)+'</span></div>'+
    '<div class="crow ind"><span class="cl">'+(own||t("owner"))+' ('+c.oPct+'%)</span><span class="cv pos">'+C+fN(c.oFin)+'</span></div>'+
    '</div>';
}

window.updCalc=function(){
  if(!BKF||_bkTab!=="main")return;
  var c=calcBk(BKF);
  var apt=getApt(V.aptId);
  var el=g("calc-live");
  if(c.gross>0){
    var html=calcBox(c,apt&&apt.owner_name);
    if(el){el.innerHTML=html;}
    else{
      var pg=qs(".screen .page");
      if(!pg)return;
      var sc=pg.scrollTop;
      var d=document.createElement("div");d.id="calc-live";d.className="field";d.innerHTML=html;
      var ta=pg.querySelector("textarea");
      if(ta&&ta.parentNode)pg.insertBefore(d,ta.parentNode);else pg.appendChild(d);
      pg.scrollTop=sc;
    }
  }
};

window.saveBk=function(){
  if(!BKF)return;
  var apt=getApt(V.aptId);
  // Collect any unsaved text fields
  ["fci","fco","fgross","ftax","fpct","fcmt","fbf"].forEach(function(fid){
    var el=g(fid);if(!el)return;
    var map={fci:"check_in",fco:"check_out",fgross:"gross_income",ftax:"tax_pct",fpct:"platform_pct",fcmt:"comment",fbf:"booking_fee"};
    if(map[fid])BKF[map[fid]]=el.value;
  });
  var saved=Object.assign({},BKF,{apartment_id:V.aptId,apartment_name:apt?apt.apartment_name:""});
  // Save locally — instant
  var i=DB.bookings.findIndex(function(b){return b.id===saved.id;});
  if(i>-1)DB.bookings[i]=saved;else DB.bookings.push(saved);
  dbSave();
  // Navigate immediately
  V.screen="apt";V.editBkId=null;BKF=null;_bkTab="main";
  renderAptScreen();
  // Push to Sheets in background
  pushBg("upsert_booking",saved);
  var exps=DB.expenses.filter(function(e){return String(e.booking_id)===String(saved.id);});
  exps.forEach(function(e){pushBg("upsert_expense",e);});
};

  var saved=Object.assign({},APTF);
  var i=DB.apts.findIndex(function(a){return a.id===saved.id;});
  if(i>-1)DB.apts[i]=saved;else DB.apts.push(saved);
  dbSave();
  var prevApt=V.aptId;
  APTF=null;V.screen=prevApt?("apt"):null;
  if(prevApt){V.aptId=saved.id;renderAptScreen();}else render();
  pushBg("upsert_apt",saved);
};

/* ═══════════════════════════════════════════════
   CLEAN FORM
═══════════════════════════════════════════════ */
function renderCleanForm(){
  if(!CLF)CLF={id:uid(),apartment_id:"",cleaner:"",date:new Date().toISOString().slice(0,10),started_at:"",finished_at:"",total_hours:"",hourly_rate:HOUR_RATE,total_amount:"",notes:""};
  var cl=CLF;
  var hrs="",hAmt="";
  if(cl.started_at&&cl.finished_at){
    var sm=cl.started_at.split(":"),em=cl.finished_at.split(":");
    var mins=(+em[0]*60+ +em[1])-(+sm[0]*60+ +sm[1]);
    if(mins>0){hrs=(mins/60).toFixed(2);hAmt=(mins/60*(parseFloat(cl.hourly_rate)||HOUR_RATE)).toFixed(2);}
  }
  if(hrs!==""){CLF.total_hours=hrs;CLF.total_amount=hAmt;}
  var aptOpts='<option value="">— Квартира —</option>'+DB.apts.map(function(a){return'<option value="'+a.id+'"'+(String(cl.apartment_id)===String(a.id)?" selected":"")+'>'+a.apartment_name+'</option>';}).join("");
  var staffList=DB.staff.filter(function(s){return s.active!=="false"&&s.active!==false;});
  root.innerHTML=
    '<div class="screen">'+
    '<div class="hdr"><div class="hdr-row">'+
      '<button class="btn" style="background:none;border:none;color:rgba(255,255,255,.5);padding:4px 6px 4px 0" onclick="CLF=null;V.screen=null;render()">'+I.back+'</button>'+
      '<div class="f1" style="font-size:15px;font-weight:600">'+t("newCleaning")+'</div>'+
      '<button class="btn btn-w" onclick="saveClean()">'+I.check+' '+t("save")+'</button>'+
    '</div></div>'+
    '<div class="page">'+
      '<div class="field"><div class="lbl">Квартира</div><select class="sel" onchange="CLF.apartment_id=this.value">'+aptOpts+'</select></div>'+
      '<div class="field"><div class="lbl">'+t("cleaner")+'</div>'+
        (staffList.length?'<select class="sel" style="margin-bottom:8px" onchange="if(this.value){CLF.cleaner=this.value;g(\'cln-inp\').value=this.value}"><option value="">— Выбрать —</option>'+staffList.map(function(s){return'<option value="'+s.name+'"'+(cl.cleaner===s.name?" selected":"")+'>'+s.name+(s.role?" · "+s.role:"")+'</option>';}).join("")+'</select>':"")+
        '<input type="text" class="inp" id="cln-inp" value="'+(cl.cleaner||"")+'" placeholder="Или введите вручную..." oninput="CLF.cleaner=this.value"/>'+
      '</div>'+
      '<div class="field"><div class="lbl">'+t("date")+'</div><input type="date" class="inp" value="'+cl.date+'" onchange="CLF.date=this.value"/></div>'+
      '<div class="g2 field">'+
        '<div><div class="lbl">'+t("startT")+'</div><input type="time" class="inp" value="'+cl.started_at+'" onchange="CLF.started_at=this.value;renderCleanForm()"/></div>'+
        '<div><div class="lbl">'+t("endT")+'</div><input type="time" class="inp" value="'+cl.finished_at+'" onchange="CLF.finished_at=this.value;renderCleanForm()"/></div>'+
      '</div>'+
      (hrs?'<div style="background:#1c1c1e;border-radius:13px;padding:14px;margin-bottom:13px;display:flex;align-items:center;justify-content:space-between">'+
        '<div><div class="mu">'+cl.started_at+' → '+cl.finished_at+'</div><div style="font-size:15px;font-weight:600;color:#34c759;margin-top:4px">'+fN(hrs)+' '+t("totalH")+'</div></div>'+
        '<div style="font-size:28px;font-weight:700;color:#34c759">₾'+fN(hAmt)+'</div>'+
      '</div>':"")+
      '<div class="g2 field">'+
        '<div><div class="lbl">'+t("hourRate")+'</div><div class="rel"><input type="number" class="inp pl" id="crate" value="'+(cl.hourly_rate||HOUR_RATE)+'" oninput="CLF.hourly_rate=this.value" onchange="renderCleanForm()"/><span class="il">₾</span></div></div>'+
        '<div><div class="lbl">'+t("totalAmt")+' ₾</div><div class="rel"><input type="number" class="inp pl" id="camt" value="'+(cl.total_amount||"")+'" oninput="CLF.total_amount=this.value"/><span class="il">₾</span></div></div>'+
      '</div>'+
      '<div class="field"><div class="lbl">'+t("notes")+'</div><textarea class="inp" id="cnot" rows="2" style="resize:none" oninput="CLF.notes=this.value">'+cl.notes+'</textarea></div>'+
    '</div>'+
    '</div>';
}
window.saveClean=function(){
  if(!CLF||!CLF.apartment_id){alert("Выберите квартиру");return;}
  var el=g("camt");if(el&&el.value)CLF.total_amount=el.value;
  var el2=g("crate");if(el2)CLF.hourly_rate=el2.value;
  var el3=g("cnot");if(el3)CLF.notes=el3.value;
  var saved=Object.assign({},CLF,{apartment_name:(getApt(CLF.apartment_id)||{}).apartment_name||""});
  DB.cleaning.push(saved);dbSave();
  CLF=null;V.screen=null;V.tab="cleaning";render();
  pushBg("upsert_cleaning",saved);
};

/* ═══════════════════════════════════════════════

function vibe(){try{if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback){window.Telegram.WebApp.HapticFeedback.impactOccurred("light");}else if(navigator.vibrate){navigator.vibrate(8);}}catch(e){}}
document.addEventListener("click",function(e){var el=e.target.closest("button,a,.apt-card,.bk-tile,.nav-btn");if(el)vibe();});

/* ═══════════════════════════════════════════════
   AUTO SYNC
═══════════════════════════════════════════════ */
setInterval(function(){if(V.screen!=="bkform"&&V.screen!=="aptform"&&V.screen!=="cleanform")syncFull();},SYNC_MS);

/* ═══════════════════════════════════════════════
   START
═══════════════════════════════════════════════ */
try{if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}}catch(e){}
// Skip onboarding for internal version
lsSet("onboarded",true);
// Clean bad expenses (amount = date string or >50000)
DB.expenses=DB.expenses.filter(function(e){
  if(!e.booking_id||e.booking_id==="")return false;
  var v=String(e.amount||"");
  if(v.includes("T00:00")||v.includes("-20")||v.match(/^\d{4}-\d{2}/))return false;
  var n=parseFloat(v);
  if(!isNaN(n)&&n>50000)return false;
  return true;
});
dbSave();
render();
syncFull();
</script>
