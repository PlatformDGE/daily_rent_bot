<body>
<div id="app"></div>

<script>
/* ══════════════════════════════════════════════════════
   CONFIG — измени SHEET_ID на свой
══════════════════════════════════════════════════════ */
const SHEET_ID = "1FyCJedWb0sRAXprDGqRYtkX7s2FYOh4dXkbQAG5BxV0";
const DEFAULT_RATE = 2.7;

/* ── Google Sheets fetch ── */
async function fetchApts() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=0`;
  const res = await fetch(url);
  const txt = await res.text();
  const json = JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  const cols = json.table.cols.map(c => c.label);
  return (json.table.rows || []).map(row => {
    const o = {};
    cols.forEach((c, i) => {
      const cell = row.c && row.c[i];
      o[c] = cell ? (cell.v !== null && cell.v !== undefined ? cell.v : cell.f || "") : "";
    });
    return o;
  }).filter(r => Object.values(r).some(v => v !== ""));
}

/* ── Storage ── */
function load(key, def) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function save(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}

/* ── ID ── */
let _id = 0;
function uid() { return Date.now().toString(36) + (++_id).toString(36); }

/* ── Utils ── */
function fN(n) {
  const v = parseFloat(n) || 0;
  return v % 1 === 0 ? v.toLocaleString("ru-RU") : v.toLocaleString("ru-RU", {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fD(d) {
  if (!d) return "—";
  return new Date(d + "T12:00:00").toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit", year:"2-digit"});
}
function fDf(d) {
  if (!d) return "—";
  return new Date(d + "T12:00:00").toLocaleDateString("ru-RU", {day:"2-digit", month:"long"});
}
function nights(a, b) {
  if (!a || !b) return 0;
  return Math.max(0, Math.round((new Date(b) - new Date(a)) / 86400000));
}
function nLbl(n) {
  if (n === 1) return "1 ночь";
  if (n >= 2 && n <= 4) return n + " ночи";
  return n + " ночей";
}
function toBaseCur(amt, cur, rate) {
  const v = parseFloat(amt) || 0;
  if (cur === "USD") return v;
  return parseFloat((v / rate).toFixed(2));
}

/* ══════════════════════════════════════════════════════
   CALC ENGINE
══════════════════════════════════════════════════════ */
function calc(b, rate) {
  rate = parseFloat(rate) || DEFAULT_RATE;
  const platform = b.platform || "Airbnb";
  const cur = b.income_currency || "USD";
  const gross = parseFloat(b.gross_income) || 0;

  // Tax (Airbnb only)
  const taxPct = platform === "Airbnb" ? (parseFloat(b.airbnb_tax_pct) || 1) : 0;
  const tax = parseFloat(((gross * taxPct) / 100).toFixed(2));
  const afterTax = parseFloat((gross - tax).toFixed(2));

  // Booking commission
  const bookFee = platform === "Booking" ? (parseFloat(b.booking_fee) || 0) : 0;

  // Expenses — convert to income currency
  const exps = (b.expenses || []).map(e => {
    const amt = parseFloat(e.amount) || 0;
    const inBase = cur === "USD" ? toBaseCur(amt, e.currency, rate) : (e.currency === "GEL" ? amt : parseFloat((amt * rate).toFixed(2)));
    return { ...e, amt, inBase };
  });

  const totalExp = parseFloat(exps.reduce((s, e) => s + e.inBase, 0).toFixed(2));
  const totalDeduct = parseFloat((totalExp + bookFee).toFixed(2));
  const net = parseFloat((afterTax - totalDeduct).toFixed(2));

  // 20/80 split
  const dPct = parseFloat(b.david_pct) || 20;
  const oPct = 100 - dPct;
  const davidBase = parseFloat((net * dPct / 100).toFixed(2));
  const ownerBase = parseFloat((net * oPct / 100).toFixed(2));

  // Expense compensation
  const expPlatform = exps.filter(e => e.payer === "platform").reduce((s, e) => s + e.inBase, 0);
  const expOwner = exps.filter(e => e.payer === "owner").reduce((s, e) => s + e.inBase, 0);

  const davidFinal = parseFloat((davidBase + expPlatform + bookFee).toFixed(2));
  const ownerFinal = parseFloat((ownerBase + expOwner).toFixed(2));

  return { gross, tax, taxPct, afterTax, bookFee, exps, totalExp, totalDeduct, net,
    dPct, oPct, davidBase, ownerBase, expPlatform, expOwner, davidFinal, ownerFinal, cur, platform };
}

/* ── Report generator ── */
function makeReport(apt, b, c) {
  const S = v => c.cur + " " + fN(v);
  const n = nights(b.check_in, b.check_out);
  const EXP_NAMES = {cleaning:"Уборка",utilities:"Коммуналка",supplies:"Расходники",repair:"Ремонт",other:"Прочее",booking_fee:"Комиссия Booking"};
  const lines = [
    `🏠 ${apt?.apartment_name || "—"}`,
    apt?.address ? `📍 ${apt.address}, Tbilisi` : null,
    ``,
    `📅 ${fDf(b.check_in)} — ${fDf(b.check_out)} (${nLbl(n)})`,
    b.guest_name ? `👤 Гость: ${b.guest_name}` : null,
    `📱 ${c.platform}`,
    ``,
    `💰 Пришло: ${S(c.gross)}`,
    c.tax > 0 ? `📉 Налог Airbnb (${c.taxPct}%): -${S(c.tax)}` : null,
    c.bookFee > 0 ? `📉 Комиссия Booking: -${S(c.bookFee)}` : null,
    c.totalExp > 0 ? `🔧 Расходы: -${S(c.totalExp)}` : null,
    ...(c.exps || []).filter(e => e.inBase > 0).map(e =>
      `   • ${EXP_NAMES[e.cat] || e.cat}: ${e.currency} ${fN(e.amt)}${e.comment ? " (" + e.comment + ")" : ""}${e.payer === "owner" ? " [Собственник]" : ""}`
    ),
    ``,
    `✅ Чистая прибыль: ${S(c.net)}`,
    ``,
    `👤 Давиду (${c.dPct}%): ${S(c.davidBase)}${c.expPlatform > 0 ? ` + ${S(c.expPlatform)} = ${S(c.davidFinal)}` : ""}`,
    `🏦 ${apt?.owner_name || "Владельцу"} (${c.oPct}%): ${S(c.ownerBase)}${c.expOwner > 0 ? ` + ${S(c.expOwner)} = ${S(c.ownerFinal)}` : ""}`,
    apt?.owner_contact ? `📞 ${apt.owner_contact}` : null,
    apt?.owner_account ? `🏦 Счёт: ${apt.owner_account}` : null,
    b.comment ? `\n💬 ${b.comment}` : null,
  ];
  return lines.filter(v => v !== null).join("\n");
}

/* ══════════════════════════════════════════════════════
   SEED DATA (из твоей таблицы)
══════════════════════════════════════════════════════ */
const SEED_APTS = [
  {id:"1",apartment_name:"Rustaveli Warm Corner",address:"7 Solomon Zaldastanishvili St",owner_name:"Sophiko",owner_contact:"+995 599 50 13 34",owner_account:"",platforms:["Airbnb"],status:"active",david_pct:20,mapLink:"",notes:""},
  {id:"2",apartment_name:"House of Whispers",address:"22 Pavle Ingorokva St",owner_name:"Mari",owner_contact:"+995 555 58 23 50",owner_account:"",platforms:["Booking"],status:"active",david_pct:20,mapLink:"",notes:""},
  {id:"3",apartment_name:"Designer View Vake",address:"15 Chavchavadze, 1st Ln",owner_name:"Arseniy",owner_contact:"",owner_account:"",platforms:["Airbnb"],status:"active",david_pct:20,mapLink:"",notes:""},
  {id:"4",apartment_name:"Sky Loft Tbilisi",address:"17 Alexander Griboedov St",owner_name:"Lasha",owner_contact:"+995 599 71 25 33",owner_account:"",platforms:["Airbnb"],status:"active",david_pct:20,mapLink:"",notes:""},
  {id:"5",apartment_name:"Vake Nest",address:"8 Dimitri Arakishvili St",owner_name:"Natia",owner_contact:"+995 577 11 06 11",owner_account:"",platforms:["Airbnb"],status:"active",david_pct:20,mapLink:"",notes:""},
  {id:"6",apartment_name:"Postcard Tbilisi",address:"18 Atoneli St",owner_name:"Stas",owner_contact:"@lil_toady",owner_account:"",platforms:["Booking"],status:"active",david_pct:20,mapLink:"",notes:""},
  {id:"7",apartment_name:"Old Tbilisi Courtyard",address:"30 Anton Katalikosi St",owner_name:"Giorgi",owner_contact:"+995 599 27 17 97",owner_account:"",platforms:["Airbnb"],status:"active",david_pct:20,mapLink:"",notes:""},
];

/* ══════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════ */
const state = {
  apts: load("dr_apts", SEED_APTS),
  bookings: load("dr_bk", []),
  rate: load("dr_rate", DEFAULT_RATE),
  tab: "apts",        // apts | dash
  view: "list",       // list | apt | bk-form | apt-form
  selApt: null,
  selBk: null,
  editApt: null,
  editBk: null,
  sync: "idle",
  syncTime: null,
  expOpen: {},        // bookingId -> expanded
};

/* ══════════════════════════════════════════════════════
   RENDER ENGINE (vanilla JS, no React)
══════════════════════════════════════════════════════ */
const app = document.getElementById("app");

function render() {
  if (state.view === "bk-form") { renderBkForm(); return; }
  if (state.view === "apt-form") { renderAptForm(); return; }
  if (state.view === "apt") { renderAptDetail(); return; }
  renderMain();
}

/* ─────────────────────────────────────────────────────

function renderAptList() {
  if (!state.apts.length) return `<div class="empty">Нет квартир<br><span style="font-size:12px">Нажмите + чтобы добавить</span></div>`;
  return state.apts.map(apt => {
    const abs = state.bookings.filter(b => b.aptId === apt.id);
    const net = abs.reduce((s, b) => s + calc(b, state.rate).net, 0);
    const last = abs.slice().sort((a, b) => new Date(b.check_in) - new Date(a.check_in))[0];
    const pls = apt.platforms || [];
    const addr = apt.address ? apt.address.split(",")[0] : "";
    return `
<div class="apt-card apt-card-btn" data-id="${apt.id}">
  <div class="apt-av">${apt.apartment_name[0]}</div>
  <div class="f1" style="min-width:0">
    <div class="flex aic gap6 wrap">
      <span style="font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${apt.apartment_name}</span>
      ${bdg(apt.status === "active" ? "green" : "gray", apt.status === "active" ? "Активна" : "Неакт.")}
    </div>
    <div style="font-size:12px;color:#4a6fa0;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${addr}</div>
    <div class="gap-wrap" style="margin-top:5px">
      ${pls.map(p => bdg(p.toLowerCase(), p)).join("")}
      <span style="font-size:11px;color:#4a6fa060">${abs.length} прожив.</span>
      ${last ? `<span style="font-size:11px;color:#4a6fa060">· ${fD(last.check_in)}</span>` : ""}
    </div>
    ${apt.owner_name ? `<div style="font-size:12px;color:#4a6fa0;margin-top:3px">${apt.owner_name}</div>` : ""}
  </div>
  <div class="tr fs0">
    <div class="mono" style="font-size:14px;font-weight:700;color:#34d399">$${fN(net)}</div>
    <div style="font-size:11px;color:#4a6fa060">чист.</div>
  </div>
</div>`;
  }).join("");
}

/* ─────────────────────────────────────────────────────
   DASHBOARD
───────────────────────────────────────────────────── */
let dashFilter = { apt: "all", month: "" };
function renderDash() {
  const fil = state.bookings.filter(b => {
    if (dashFilter.apt !== "all" && b.aptId !== dashFilter.apt) return false;
    if (dashFilter.month && (b.check_in || "").slice(0, 7) !== dashFilter.month) return false;
    return true;
  });
  const T = fil.reduce((acc, b) => {
    const c = calc(b, state.rate);
    return { gross: acc.gross + c.gross, net: acc.net + c.net, exp: acc.exp + c.totalDeduct, david: acc.david + c.davidFinal, owner: acc.owner + c.ownerFinal };
  }, { gross: 0, net: 0, exp: 0, david: 0, owner: 0 });

  const aptOpts = `<option value="all">Все квартиры</option>` + state.apts.map(a => `<option value="${a.id}" ${dashFilter.apt === a.id ? "selected" : ""}>${a.apartment_name}</option>`).join("");

  const aptRows = state.apts.map(apt => {
    const ab = fil.filter(b => b.aptId === apt.id);
    if (!ab.length) return "";
    const net = ab.reduce((s, b) => s + calc(b, state.rate).net, 0);
    const gross = ab.reduce((s, b) => s + calc(b, state.rate).gross, 0);
    return `<div class="card card-p sp8">
      <div class="flex jb aic">
        <div>
          <div style="font-size:14px;font-weight:600">${apt.apartment_name}</div>
          ${apt.owner_name ? `<div style="font-size:12px;color:#4a6fa0">${apt.owner_name}</div>` : ""}
          <div style="font-size:12px;color:#4a6fa0">${ab.length} прожив. · $${fN(gross)}</div>
        </div>
        <div class="mono" style="font-size:14px;font-weight:700;color:#34d399">$${fN(net)}</div>
      </div>
    </div>`;
  }).join("");

  return `
<div class="field"><select id="dash-apt" class="sel">${aptOpts}</select></div>
<div class="field"><input type="month" id="dash-month" value="${dashFilter.month}" class="inp"/></div>
<div class="stat-grid">
  ${[["Пришло", T.gross, "#fff"], ["Чистая прибыль", T.net, "#34d399"], ["Расходы", T.exp, "#fb923c"], ["Давиду", T.david, "#4f8ef7"]].map(([l, v, c]) =>
    `<div class="stat"><div class="stat-l">${l}</div><div class="stat-v" style="color:${c}">$${fN(v)}</div></div>`
  ).join("")}
</div>
<div class="card card-p sp" style="margin-bottom:14px">
  ${[{l:"Давиду",v:T.david,c:"#4f8ef7",bar:"#3b82f6",w:"20%"},{l:"Владельцам",v:T.owner,c:"#34d399",bar:"#10b981",w:"80%"}].map(it => `
  <div style="margin-bottom:12px">
    <div class="flex jb" style="margin-bottom:5px"><span style="font-size:14px;color:#93c5fd">${it.l}</span><span class="mono" style="font-size:14px;font-weight:700;color:${it.c}">$${fN(it.v)}</span></div>
    <div style="height:5px;background:#071020;border-radius:3px"><div style="height:5px;border-radius:3px;background:${it.bar};width:${it.w}"></div></div>
  </div>`).join("")}
</div>
${aptRows}
${!fil.length ? `<div class="empty">Нет данных</div>` : ""}`;
}

function bindDashEvents() {
  const aptSel = document.getElementById("dash-apt");
  const monthInp = document.getElementById("dash-month");
  if (aptSel) aptSel.addEventListener("change", e => { dashFilter.apt = e.target.value; document.getElementById("main-content").innerHTML = renderDash(); bindDashEvents(); });
  if (monthInp) monthInp.addEventListener("input", e => { dashFilter.month = e.target.value; document.getElementById("main-content").innerHTML = renderDash(); bindDashEvents(); });
}

        </div>
      </div>
      <div class="tr fs0">
        <div class="mono" style="font-size:15px;font-weight:700">${c.cur} ${fN(c.gross)}</div>
        <div class="mono" style="font-size:13px;color:#34d399">${c.cur} ${fN(c.net)}</div>
      </div>
    </div>
  </div>
  ${open ? `<div class="bk-detail" id="bk-detail-${bk.id}">${detailHtml}</div>` : ""}
</div>`;
  }).join("");

  app.innerHTML = `
<div class="screen">
  <div class="hdr">
    <div class="hdr-row">
      <button id="back-btn" style="background:none;border:none;color:#4a6fa0;cursor:pointer;padding:4px 6px 4px 0">${IC.back}</button>
      <div class="f1">
        <div style="font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${apt.apartment_name}</div>
        <div style="font-size:12px;color:#4a6fa0;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${apt.address || ""}</div>
      </div>
      <button id="edit-apt-btn" style="background:none;border:none;color:#4a6fa060;cursor:pointer;padding:6px">${IC.edit}</button>
    </div>
    ${apt.owner_name || apt.owner_contact ? `
    <div class="owner-strip">
      <div class="ow-av">${(apt.owner_name || "?")[0]}</div>
      <div class="f1">
        <div style="font-size:13px;font-weight:600">${apt.owner_name || ""}</div>
        ${apt.owner_contact ? `<div style="font-size:12px;color:#4a6fa0">${apt.owner_contact}</div>` : ""}
      </div>
      ${apt.owner_account ? `<div class="mono" style="font-size:11px;color:#93c5fd;max-width:110px;overflow:hidden;text-overflow:ellipsis">${apt.owner_account}</div>` : ""}
    </div>` : ""}
  </div>
  <div class="page">
    <div class="stat-grid">
      ${[["Пришло", totG, "#fff"], ["Чистая прибыль", totN, "#34d399"], ["Давиду", totD, "#4f8ef7"], ["Владельцу", totO, "#34d399"]].map(([l, v, c]) =>

      ).join("")}

function renderBkDetail(bk, c, apt) {
  const EXP_NAMES = {cleaning:"Уборка",utilities:"Коммуналка",supplies:"Расходники",repair:"Ремонт",other:"Прочее",booking_fee:"Комиссия Booking"};
  const S = v => `${c.cur} ${fN(v)}`;

  const rows = [
    `<div class="crow"><span class="cl">Пришло</span><span class="cv">${S(c.gross)}</span></div>`,
    c.tax > 0 ? `<div class="crow"><span class="cl">Налог Airbnb (${c.taxPct}%)</span><span class="cv neg">-${S(c.tax)}</span></div>` : "",
    c.bookFee > 0 ? `<div class="crow"><span class="cl">Комиссия Booking</span><span class="cv neg">-${S(c.bookFee)}</span></div>` : "",
    ...c.exps.filter(e => e.inBase > 0).map(e =>
      `<div class="crow sub"><span class="cl" style="color:#4a6fa060">• ${EXP_NAMES[e.cat] || e.cat} <span style="font-size:11px">(${e.currency})</span></span><span class="cv neg">-${e.currency} ${fN(e.amt)}</span></div>`
    ),
    `<div class="cdiv"></div>`,
    `<div class="crow net"><span class="cl" style="font-weight:600;color:#fff">Чистая прибыль</span><span class="cv big ${c.net >= 0 ? "em" : "neg"}">${S(c.net)}</span></div>`,
    `<div class="cdiv"></div>`,
    `<div class="crow sub"><span class="cl">Давиду (${c.dPct}%)</span><span class="cv bl">${S(c.davidBase)}</span></div>`,
    c.expPlatform > 0 ? `<div class="crow sub"><span class="cl" style="color:#4a6fa060">+ компенсация</span><span class="cv bl">+${S(c.expPlatform)}</span></div>` : "",
    `<div class="crow sub"><span class="cl" style="font-weight:600">= Итого Давиду</span><span class="cv bl" style="font-size:15px;font-weight:700">${S(c.davidFinal)}</span></div>`,
    `<div class="cdiv"></div>`,
    `<div class="crow sub"><span class="cl">${apt.owner_name || "Владелец"} (${c.oPct}%)</span><span class="cv em">${S(c.ownerBase)}</span></div>`,
    c.expOwner > 0 ? `<div class="crow sub"><span class="cl" style="color:#4a6fa060">+ компенсация</span><span class="cv em">+${S(c.expOwner)}</span></div>` : "",
    `<div class="crow sub"><span class="cl" style="font-weight:600">= Итого владельцу</span><span class="cv em" style="font-size:15px;font-weight:700">${S(c.ownerFinal)}</span></div>`,
  ].join("");

let bkForm = null;

function initBkForm() {
  const apt = state.selApt;
  const defPlat = apt?.platforms?.[0] || "Airbnb";
  const defCur = defPlat === "Airbnb" ? "USD" : "GEL";
  if (state.editBk) {
    bkForm = JSON.parse(JSON.stringify(state.editBk));
    if (!bkForm.expenses) bkForm.expenses = [];
  } else {
    bkForm = {
      id: uid(), check_in: "", check_out: "", gross_income: "", income_currency: defCur,
      platform: defPlat, guest_name: "", comment: "", receipts: [],
      payment_status: "received", david_pct: apt?.david_pct || 20,
      airbnb_tax_pct: 1, booking_fee: "", expenses: [],
    };

}

  const calcHtml = renderCalcBox(c, apt?.owner_name);
  const rpt = makeReport(apt, b, c);

  app.innerHTML = `
<div class="screen">
  <div class="hdr">
    <div class="hdr-row">
      <button id="bk-back" style="background:none;border:none;color:#4a6fa0;cursor:pointer;padding:4px 6px 4px 0">${IC.back}</button>
      <div class="f1">
        <div style="font-size:12px;color:#4a6fa0">${apt?.apartment_name || ""}</div>
        <div style="font-size:15px;font-weight:600">${state.editBk ? "Редактировать" : "Новое проживание"}</div>
      </div>
      <button id="bk-save" class="btn btn-p">${IC.check} Сохранить</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab ${bkTab==="main"?"on":""}" data-tab="main">Основное</button>
    <button class="tab ${bkTab==="exp"?"on":""}" data-tab="exp">Расходы</button>
    <button class="tab ${bkTab==="rpt"?"on":""}" data-tab="rpt">Отчёт</button>
  </div>
  <div class="page" id="bk-page">

  ${bkTab === "main" ? `
    <div class="grid2 field">
      <div><div class="lbl">Заезд</div><input type="date" class="inp" id="f-checkin" value="${b.check_in}"/></div>
      <div><div class="lbl">Выезд</div><input type="date" class="inp" id="f-checkout" value="${b.check_out}"/></div>

    ${n > 0 ? `<div class="night-pill">${nLbl(n)}</div>` : ""}
    <div class="field"><div class="lbl">Имя гостя</div><input type="text" class="inp" id="f-guest" value="${b.guest_name}" placeholder="Giorgi M."/></div>
    <div class="field">
      <div class="lbl">Платформа</div>
      <div class="plat-pick">${platBtns}</div>
    </div>
    ${b.platform === "Airbnb" ? `<div class="field"><div class="lbl">Налог Airbnb (%)</div><div class="irel"><input type="number" class="inp pr" id="f-tax" value="${b.airbnb_tax_pct}" step="0.1"/><span class="ir">%</span></div></div>` : ""}
    <div class="field">
      <div class="lbl">Сумма поступления</div>
      <div class="flex gap8 aic">
        <div class="f1 irel"><span class="il" style="font-size:13px;color:#4a6fa0">$</span><input type="number" class="inp pl" id="f-gross" value="${b.gross_income}" placeholder="0"/></div>
        <div class="cur-btns" id="income-cur">${curBtns(b.income_currency)}</div>
      </div>
    </div>
    ${b.platform === "Booking" ? `<div class="field"><div class="lbl">Комиссия Booking</div><div class="irel"><span class="il" style="font-size:13px;color:#4a6fa0">$</span><input type="number" class="inp pl" id="f-bookfee" value="${b.booking_fee}" placeholder="0"/></div></div>` : ""}
    <div class="grid2 field">

      <div><div class="lbl">Статус</div><select class="sel" id="f-status">
        <option value="received" ${b.payment_status==="received"?"selected":""}>✓ Получено</option>
        <option value="pending" ${b.payment_status==="pending"?"selected":""}>⏳ Ожидается</option>
        <option value="partial" ${b.payment_status==="partial"?"selected":""}>◑ Частично</option>
      </select></div>
    </div>
    ${c.gross > 0 ? calcHtml : ""}
    <div class="field"><div class="lbl">Комментарий</div><textarea class="inp" id="f-comment" rows="3" placeholder="Заметки о госте..." style="resize:none">${b.comment}</textarea></div>
  ` : ""}

  ${bkTab === "exp" ? `
    <div class="sec-ttl">Добавить категорию</div>
    <div style="margin-bottom:12px">${addCatBtns}</div>
    ${expRows || `<div class="empty" style="padding:20px">Нет расходов</div>`}
    <div style="margin-top:12px">
      <div class="sec-ttl">Чеки и фото</div>
      <div class="receipt-wrap" id="receipt-wrap">
        ${(b.receipts||[]).map((r,i) => `

  ${bkTab === "rpt" ? `
    <div class="card card-p field">
      <div class="sec-ttl">Превью отчёта</div>
      <div class="rpt">${rpt}</div>
    </div>
    ${apt?.owner_account ? `<div class="card flex aic gap8 card-p field">${IC.bank}<span style="font-size:12px;color:#4a6fa0">Счёт:</span><span class="mono" style="font-size:12px;color:#93c5fd">${apt.owner_account}</span></div>` : ""}
    <div class="grid2 field">
      <button id="copy-btn" class="btn btn-s">${IC.copy} Копировать</button>
      <button id="tg-btn" class="btn btn-s">${IC.tg} Telegram</button>
    </div>
  ` : ""}

  </div>
</div>`;

  // Nav
  document.querySelectorAll(".tab[data-tab]").forEach(el => {
    el.addEventListener("click", () => { bkTab = el.dataset.tab; syncFormToState(); renderBkForm(); });
  });

  // Back / Save
  document.getElementById("bk-back").addEventListener("click", () => {
    bkForm = null; bkTab = "main"; state.view = "apt"; renderAptDetail();
  });
  document.getElementById("bk-save").addEventListener("click", () => {
    syncFormToState();
    const saved = { ...bkForm, aptId: state.selApt.id };
    if (state.editBk) {
      state.bookings = state.bookings.map(b => b.id === saved.id ? saved : b);
    } else {
      state.bookings.push(saved);
    }
    save("dr_bk", state.bookings);
    bkForm = null; bkTab = "main"; state.editBk = null; state.view = "apt"; renderAptDetail();
  });

  // Platform
  document.querySelectorAll(".plat-btn[data-plat]").forEach(el => {
    el.addEventListener("click", () => {
      syncFormToState();
      bkForm.platform = el.dataset.plat;
      bkForm.income_currency = bkForm.platform === "Airbnb" ? "USD" : "GEL";
      renderBkForm();
    });
  });

  // Income currency
  if (document.getElementById("income-cur")) {
    document.querySelectorAll("#income-cur .cur-btn").forEach(el => {

      renderBkForm();

  });

  document.querySelectorAll(".payer-btn[data-payer]").forEach(el => {

      renderBkForm();

      renderBkForm();
    });
  });

  // Delete expense
  document.querySelectorAll(".exp-del-btn[data-idx]").forEach(el => {
    el.addEventListener("click", () => {
      syncFormToState();
      bkForm.expenses.splice(parseInt(el.dataset.idx), 1);
      renderBkForm();
    });
  });

  // Receipts
  if (document.getElementById("add-receipt")) {
    document.getElementById("add-receipt").addEventListener("click", () => document.getElementById("file-inp").click());
    document.getElementById("file-inp").addEventListener("change", e => {
      syncFormToState();
      const files = Array.from(e.target.files);
      let done = 0;
      files.forEach(f => {
        const r = new FileReader();
        r.onload = ev => {
          bkForm.receipts.push({ id: uid(), name: f.name, data: ev.target.result });
          done++;
          if (done === files.length) renderBkForm();
        };
        r.readAsDataURL(f);
      });
      e.target.value = "";
    });
    document.querySelectorAll(".del-receipt[data-idx]").forEach(el => {
      el.addEventListener("click", () => {
        syncFormToState();
        bkForm.receipts.splice(parseInt(el.dataset.idx), 1);
        renderBkForm();
      });
    });
  }

  // Report
  if (bkTab === "rpt") {
    document.getElementById("copy-btn").addEventListener("click", () => {
      navigator.clipboard.writeText(rpt);
      document.getElementById("copy-btn").innerHTML = IC.check + " Скопировано!";
      setTimeout(() => document.getElementById("copy-btn") && (document.getElementById("copy-btn").innerHTML = IC.copy + " Копировать"), 2000);
    });
    document.getElementById("tg-btn").addEventListener("click", () => window.open("https://t.me/share/url?text=" + encodeURIComponent(rpt), "_blank"));
  }
}

function syncFormToState() {
  if (!bkForm) return;
  const g = id => document.getElementById(id);
  if (g("f-checkin")) bkForm.check_in = g("f-checkin").value;
  if (g("f-checkout")) bkForm.check_out = g("f-checkout").value;
  if (g("f-guest")) bkForm.guest_name = g("f-guest").value;
  if (g("f-gross")) bkForm.gross_income = g("f-gross").value;
  if (g("f-tax")) bkForm.airbnb_tax_pct = g("f-tax").value;
  if (g("f-bookfee")) bkForm.booking_fee = g("f-bookfee").value;
  if (g("f-david")) bkForm.david_pct = g("f-david").value;
  if (g("f-status")) bkForm.payment_status = g("f-status").value;
  if (g("f-comment")) bkForm.comment = g("f-comment").value;
  document.querySelectorAll(".exp-amt").forEach(el => { if (bkForm.expenses[parseInt(el.dataset.idx)]) bkForm.expenses[parseInt(el.dataset.idx)].amount = el.value; });
  document.querySelectorAll(".exp-comment").forEach(el => { if (bkForm.expenses[parseInt(el.dataset.idx)]) bkForm.expenses[parseInt(el.dataset.idx)].comment = el.value; });
}

function renderCalcBox(c, ownerName) {
  const S = v => `${c.cur} ${fN(v)}`;
  return `<div class="cbox field">
    <div class="crow"><span class="cl">Пришло</span><span class="cv">${S(c.gross)}</span></div>
    ${c.tax > 0 ? `<div class="crow"><span class="cl">Налог Airbnb (${c.taxPct}%)</span><span class="cv neg">-${S(c.tax)}</span></div>` : ""}
    ${c.bookFee > 0 ? `<div class="crow"><span class="cl">Комиссия Booking</span><span class="cv neg">-${S(c.bookFee)}</span></div>` : ""}
    ${c.totalExp > 0 ? c.exps.filter(e=>e.inBase>0).map(e=>`<div class="crow sub"><span class="cl" style="color:#4a6fa060">• ${EXP_NAMES[e.cat]||e.cat}</span><span class="cv neg">-${e.currency} ${fN(e.amt)}</span></div>`).join("") : ""}
    <div class="cdiv"></div>
    <div class="crow net"><span class="cl" style="font-weight:600;color:#fff">Чистая прибыль</span><span class="cv big ${c.net>=0?"em":"neg"}">${S(c.net)}</span></div>
    <div class="cdiv"></div>
    <div class="crow sub"><span class="cl" style="font-weight:600">= Давиду</span><span class="cv bl" style="font-size:14px;font-weight:700">${S(c.davidFinal)}</span></div>
    <div class="crow sub"><span class="cl" style="font-weight:600">= ${ownerName||"Владельцу"}</span><span class="cv em" style="font-size:14px;font-weight:700">${S(c.ownerFinal)}</span></div>
  </div>`;
}

async function doSync() {
  state.sync = "loading";
  render();
  try {
    const rows = await fetchApts();
