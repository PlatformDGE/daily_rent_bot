/* ══ STORAGE ════════════════════════════════════════ */
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var _c=0;
function uid(){return Date.now().toString(36)+(++_c);}

/* ══ UTILS ══════════════════════════════════════════ */
function fN(n){var v=parseFloat(n)||0;return v%1===0?v.toLocaleString("ru-RU"):v.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fD(d){if(!d)return"—";return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit"});}
function fDf(d,lang){if(!d)return"—";return new Date(d+"T12:00:00").toLocaleDateString(lang==="ka"?"ka-GE":"ru-RU",{day:"2-digit",month:"long"});}
function nts(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));}
function nL(n){if(n===1)return"1 ночь";if(n>=2&&n<=4)return n+" ночи";return n+" ночей";}
function g(id){return document.getElementById(id);}
function cs(c){return c==="GEL"?"₾":"$";}
function toUSD(v,cur,rate){return cur==="USD"?v:parseFloat((v/rate).toFixed(2));}
function t(key){return(LANG[S.uiLang]||LANG.ru)[key]||key;}

/* ══ NBG RATE FETCH ═════════════════════════════════ */
async function fetchNBGRate(){
  try{
    var today=new Date().toISOString().slice(0,10);
    var url="https://nbg.gov.ge/gw/api/ct/monetarypolicy/currencies/en/json?date="+today;
    var res=await fetch(url);
    var data=await res.json();
    var usd=data[0]&&data[0].currencies&&data[0].currencies.find(function(c){return c.code==="USD";});
    if(usd&&usd.rate){
      S.rate=parseFloat(usd.rate.toFixed(4));
      save("dr11_rate",S.rate);
      return true;
    }
  }catch(e){console.log("NBG rate fetch failed:",e);}
  return false;
}

  var cur=b.income_currency||"USD";
  var gross=parseFloat(b.gross_income)||0;
  var taxPct=plat==="Airbnb"?(parseFloat(b.tax_pct)||0):0;
  var tax=parseFloat((gross*taxPct/100).toFixed(2));
  var afterTax=parseFloat((gross-tax).toFixed(2));
  var bookFee=plat==="Booking"?(parseFloat(b.booking_fee)||0):0;
  // Include utilities in expenses
  var utilTotal=0;
  (b.utilities||[]).forEach(function(u){utilTotal+=parseFloat(u.amount)||0;});
  var exps=(b.expenses||[]).map(function(e){
    var amt=parseFloat(e.amount)||0;
    var inBase=cur==="USD"?
      (e.currency==="USD"?amt:parseFloat((amt/rate).toFixed(2))):
      (e.currency==="GEL"?amt:parseFloat((amt*rate).toFixed(2)));
    return{id:e.id,cat:e.cat,amount:amt,currency:e.currency,payer:e.payer,comment:e.comment,hours:e.hours,inBase:inBase};
  });
  // Utilities counted in income currency (GEL by default)
  var utilInBase=cur==="USD"?parseFloat((utilTotal/rate).toFixed(2)):utilTotal;
  var totalExp=parseFloat((exps.reduce(function(s,e){return s+e.inBase;},0)+utilInBase).toFixed(2));
  var net=parseFloat((afterTax-totalExp-bookFee).toFixed(2));
  var dPct=parseFloat(b.platform_pct)||20;
  var oPct=100-dPct;
  var dBase=parseFloat((net*dPct/100).toFixed(2));
  var oBase=parseFloat((net*oPct/100).toFixed(2));
  var expPlat=parseFloat(exps.filter(function(e){return e.payer==="platform";}).reduce(function(s,e){return s+e.inBase;},0).toFixed(2));
  var expOwn=parseFloat(exps.filter(function(e){return e.payer==="owner";}).reduce(function(s,e){return s+e.inBase;},0).toFixed(2));
  var dFin=parseFloat((dBase+expPlat+bookFee).toFixed(2));
  var oFin=parseFloat((oBase+expOwn+utilInBase).toFixed(2));
  return{gross:gross,tax:tax,taxPct:taxPct,afterTax:afterTax,bookFee:bookFee,
    exps:exps,utilTotal:utilTotal,utilInBase:utilInBase,totalExp:totalExp,
    net:net,dPct:dPct,oPct:oPct,dBase:dBase,oBase:oBase,
    expPlat:expPlat,expOwn:expOwn,dFin:dFin,oFin:oFin,cur:cur,plat:plat,
    grossUSD:toUSD(gross,cur,rate),netUSD:toUSD(net,cur,rate),
    dFinUSD:toUSD(dFin,cur,rate),oFinUSD:toUSD(oFin,cur,rate)};
}

/* ══ REPORT ═════════════════════════════════════════ */
function makeReport(apt,b,c,lang){
  lang=lang||"ru";
  var L=LANG[lang]||LANG.ru;
  var S2=function(v){return cs(c.cur)+fN(v);};
  var n=nts(b.check_in,b.check_out);
  var nLabel=lang==="ka"?(n+" ღამე"):(nL(n));
  var EXP_LBL_KA={cleaning:"დასუფთავება",utilities:"კომუნალური",supplies:"მასალები",repair:"რემონტი",other:"სხვა",booking_fee:"Booking-ის საკომისიო"};
  var expLblLoc=lang==="ka"?EXP_LBL_KA:EXP_LBL;
  var expLines=c.exps.filter(function(e){return e.inBase>0;}).map(function(e){
    return"   • "+(expLblLoc[e.cat]||e.cat)+": "+cs(e.currency)+fN(e.amount)+(e.comment?" ("+e.comment+")":"")+(e.payer==="owner"?" ["+L.nbySelf+"]":"");
  });
  if(c.utilTotal>0)expLines.push("   • "+L.utilities+": ₾"+fN(c.utilTotal));
  var lines=[
    "🏠 "+(apt?apt.apartment_name:"—"),
    apt&&apt.address?"📍 "+apt.address+", Tbilisi":null,
    "",
    "📅 "+L.rptPeriod+": "+fDf(b.check_in,lang)+" — "+fDf(b.check_out,lang)+" ("+nLabel+")",
    b.guest_name?"👤 "+L.rptGuest+": "+b.guest_name:null,
    "📱 "+L.rptPlatformLbl+": "+c.plat,
    "",
    "💰 "+L.rptArrived+": "+S2(c.gross),
    c.tax>0?"📉 "+L.rptTax+" ("+c.taxPct+"%): -"+S2(c.tax):null,
    c.bookFee>0?"📉 "+L.rptBookFee+": -"+S2(c.bookFee):null,
    c.totalExp>0?"🔧 "+L.rptExpenses+": -"+S2(c.totalExp):null,
  ].concat(expLines).concat([
    "",
    "✅ "+L.rptNet+": "+S2(c.net),
    "",
    "👤 "+L.rptPlatShare+" ("+c.dPct+"%): "+S2(c.dFin),
    "🏦 "+(apt?apt.owner_name||L.rptOwner:L.rptOwner)+" ("+c.oPct+"%): "+S2(c.oFin),
    apt&&apt.owner_account?"🏦 "+L.rptAccount+": "+apt.owner_account:null,
    b.comment?"\n💬 "+b.comment:null,
  ]);
  return lines.filter(function(l){return l!==null;}).join("\n");
}

/* ══ CURRENCY SUMMARY ═══════════════════════════════ */
function curSummaryHtml(bks,rate,ownerName){
  var usdBks=bks.filter(function(b){return(b.income_currency||"USD")==="USD";});
  var gelBks=bks.filter(function(b){return(b.income_currency||"USD")==="GEL";});
  function tot(arr){return arr.reduce(function(acc,b){var c=calc(b,rate);return{gross:acc.gross+c.gross,net:acc.net+c.net,exp:acc.exp+c.totalExp,plat:acc.plat+c.dFin,own:acc.own+c.oFin,netUSD:acc.netUSD+c.netUSD,platUSD:acc.platUSD+c.dFinUSD,ownUSD:acc.ownUSD+c.oFinUSD};},{gross:0,net:0,exp:0,plat:0,own:0,netUSD:0,platUSD:0,ownUSD:0});}
  var tU=tot(usdBks),tG=tot(gelBks);
  var html="";
  if(usdBks.length){
    html+='<div class="cur-block" style="background:#0e1f3a;border:1px solid rgba(253,224,71,.2)">'+
      '<div class="cur-hdr" style="background:rgba(253,224,71,.08);color:#fde047">USD — '+usdBks.length+' '+t("stays")+'</div>'+
      mkCurRow(t("arrived"),"$"+fN(tU.gross),"#fff")+
      mkCurRow(t("expenses"),"-$"+fN(tU.exp),"#f87171")+
      mkCurRow(t("net"),"$"+fN(tU.net),"#34d399")+
      mkCurRow(t("platform"),"$"+fN(tU.plat),"#60a5fa")+
      mkCurRow(ownerName||t("owner"),"$"+fN(tU.own),"#34d399")+
    '</div>';
  }
  if(gelBks.length){
    html+='<div class="cur-block" style="background:#0e1f3a;border:1px solid rgba(52,211,153,.2)">'+
      '<div class="cur-hdr" style="background:rgba(52,211,153,.08);color:#6ee7b7">GEL — '+gelBks.length+' '+t("stays")+'</div>'+
      mkCurRow(t("arrived"),"₾"+fN(tG.gross),"#fff")+
      mkCurRow(t("expenses"),"-₾"+fN(tG.exp),"#f87171")+
      mkCurRow(t("net"),"₾"+fN(tG.net),"#34d399")+
      mkCurRow(t("platform"),"₾"+fN(tG.plat),"#60a5fa")+
      mkCurRow(ownerName||t("owner"),"₾"+fN(tG.own),"#34d399")+
    '</div>';
  }
  if(usdBks.length&&gelBks.length){
    var totalNet=parseFloat((tU.netUSD+tG.netUSD).toFixed(2));
    var totalPlat=parseFloat((tU.platUSD+tG.platUSD).toFixed(2));
    var totalOwn=parseFloat((tU.ownUSD+tG.ownUSD).toFixed(2));
    html+='<div class="total-bar">'+
      '<div class="sec" style="margin-bottom:8px">'+t("total")+' ('+t("byRate")+' '+fN(rate)+')</div>'+
      mkCurRow(t("net"),"$"+fN(totalNet),"#34d399")+
      mkCurRow(t("platform"),"$"+fN(totalPlat),"#60a5fa")+
      mkCurRow(ownerName||t("owner"),"$"+fN(totalOwn),"#34d399")+
    '</div>';
  }
  return html||'<div class="empty">'+t("noStays")+'</div>';
}

window.doSync=async function(){
  S.sync="loading";render();
  // Fetch NBG rate
  await fetchNBGRate();
  if(S.rate!==DEF_RATE){
    var today=new Date().toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
    S.rateDate=today;
  }
  try{
    var res=await fetch("https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&gid=0");
    var txt=await res.text();
    var json=JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    var cols=json.table.cols.map(function(c){return c.label;});
    var rows=(json.table.rows||[]).map(function(row){
      var o={};cols.forEach(function(c,i){var cell=row.c&&row.c[i];o[c]=cell?(cell.v!==null&&cell.v!==undefined?cell.v:cell.f||""):"";});return o;
    }).filter(function(r){return Object.values(r).some(function(v){return v!=="";});});
    if(rows.length){
      var inc=rows.filter(function(r){return r.apartment_id||r.apartment_name;}).map(function(r){
        return{id:String(r.apartment_id||uid()),apartment_id:r.apartment_id,apartment_name:r.apartment_name||"",address:r.address||"",owner_name:r.owner_name||"",owner_contact:r.owner_contact||"",owner_account:"",platforms:["Airbnb","Booking"],status:"active",platform_pct:20,mapLink:"",notes:"",utilities:[]};
      });
      var merged=inc.map(function(s){
        var ex=S.apts.find(function(p){return String(p.id)===String(s.id)||String(p.apartment_id)===String(s.apartment_id);});
        return ex?Object.assign({},ex,{apartment_name:s.apartment_name,address:s.address,owner_name:s.owner_name,owner_contact:s.owner_contact}):s;
      });
      S.apts.forEach(function(p){if(!merged.find(function(m){return String(m.id)===String(p.id);}))merged.push(p);});
      S.apts=merged;save("dr11_apts",S.apts);
    }
    S.sync="ok";S.syncTime=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    setTimeout(function(){S.sync="idle";render();},8000);
  }catch(e){S.sync="err";}
  render();
};

          '<button class="lang-btn'+(bkRptLang==="ka"?" on":"")+'\" onclick="setBkRptLang(\'ka\')">🇬🇪 KA</button>'+
        '</div>'+
      '</div>'+
      '<div class="rpt">'+makeReport(apt,b,c,bkRptLang)+'</div>'+
    '</div>'+
    (apt&&apt.owner_account?'<div class="card pad field" style="display:flex;align-items:center;gap:8px"><span class="muted">Счёт:</span><span style="font-family:monospace;font-size:12px;color:#93c5fd">'+apt.owner_account+'</span></div>':"")+
    '<div class="field"><button id="copy-btn" class="btn btn-s" style="width:100%">'+I.copy+' '+t("copyRpt")+'</button></div>';

  root.innerHTML=
    '<div class="modal">'+
    '<div class="hdr"><div class="hdr-row">'+
      '<button class="btn" style="background:none;border:none;color:rgba(147,197,253,.5);padding:4px 6px 4px 0" onclick="backFromBkForm()">'+I.back+'</button>'+
      '<div class="f1"><div class="muted" style="font-size:12px">'+(apt?apt.apartment_name:"")+'</div>'+
        '<div style="font-size:15px;font-weight:600">'+(S.editBk?t("edit"):t("newStay"))+'</div></div>'+
      '<button class="btn btn-p" onclick="saveBk()">'+I.check+' '+t("save")+'</button>'+
    '</div></div>'+
    '<div class="tabs">'+[[t("main"),"main"],[t("exp"),"exp"],[t("rpt"),"rpt"]].map(function(x){return'<button class="tab'+(bkTab===x[1]?" on":"")+'\" onclick="switchBkTab(\''+x[1]+'\')">'+x[0]+'</button>';}).join("")+'</div>'+
    '<div class="page">'+(bkTab==="main"?mainHtml:bkTab==="exp"?expHtml:rptHtml)+'</div>'+
    '</div>';

  if(g("copy-btn")){
    g("copy-btn").addEventListener("click",function(){
      var rptText=makeReport(apt,b,calc(b,S.rate),bkRptLang);
      navigator.clipboard.writeText(rptText).catch(function(){});
      g("copy-btn").innerHTML=I.check+" "+t("copied");
      setTimeout(function(){if(g("copy-btn"))g("copy-btn").innerHTML=I.copy+" "+t("copyRpt");},2000);
    });
  }
}

window.setBkRptLang=function(lang){bkRptLang=lang;renderBkForm();};
window.rerenderCalc=function(){
  if(!bkF||bkTab!=="main")return;
  var c=calc(bkF,S.rate);
  var el=g("calc-live");
  if(c.gross>0){
    if(el){el.innerHTML=calcBoxHtml(c,S.selApt&&S.selApt.owner_name);}
    else{var pg=document.querySelector(".modal .page");if(pg){var d=document.createElement("div");d.id="calc-live";d.className="field";d.innerHTML=calcBoxHtml(c,S.selApt&&S.selApt.owner_name);var ta=pg.querySelector("textarea");if(ta&&ta.parentNode)pg.insertBefore(d,ta.parentNode);else pg.appendChild(d);}}
  }
};
window.backFromBkForm=function(){bkF=null;bkTab="main";S.editBk=null;S.view="apt";renderApt();};
window.switchBkTab=function(tab){bkTab=tab;renderBkForm();};
window.setBkPlat=function(p){bkF.platform=p;bkF.income_currency=p==="Airbnb"?"USD":"GEL";renderBkForm();};
window.setIncomeCur=function(c){bkF.income_currency=c;renderBkForm();};
window.addExp=function(cat){bkF.expenses=bkF.expenses||[];bkF.expenses.push({id:uid(),cat:cat,amount:"",currency:bkF.income_currency||"USD",payer:"platform",comment:"",hours:""});renderBkForm();};
window.delExp=function(i){bkF.expenses.splice(i,1);renderBkForm();};
window.setExpAmt=function(i,v){if(bkF.expenses[i])bkF.expenses[i].amount=v;};
window.setExpHours=function(i,v){if(bkF.expenses[i]){bkF.expenses[i].hours=v;renderBkForm();}};
window.applyHours=function(i){if(!bkF.expenses[i])return;var hrs=parseFloat(bkF.expenses[i].hours)||0;bkF.expenses[i].amount=parseFloat((hrs*HOUR_RATE).toFixed(2));bkF.expenses[i].currency="GEL";renderBkForm();};
window.setExpCur=function(i,v){if(bkF.expenses[i]){bkF.expenses[i].currency=v;renderBkForm();}};
window.setExpPayer=function(i,v){if(bkF.expenses[i]){bkF.expenses[i].payer=v;renderBkForm();}};
window.setExpComment=function(i,v){if(bkF.expenses[i])bkF.expenses[i].comment=v;};
window.addReceipts=function(inp){var files=Array.from(inp.files);var done=0;files.forEach(function(f){var r=new FileReader();r.onload=function(ev){bkF.receipts=bkF.receipts||[];bkF.receipts.push({id:uid(),name:f.name,data:ev.target.result});done++;if(done===files.length)renderBkForm();};r.readAsDataURL(f);});inp.value="";};
window.delReceipt=function(i){bkF.receipts.splice(i,1);renderBkForm();};
window.saveBk=function(){
  if(!bkF)return;
  var apt=S.selApt;
  var saved=Object.assign({},bkF,{aptId:apt.id});
  if(S.editBk){S.bks=S.bks.map(function(b){return b.id===saved.id?saved:b;});}
  else{S.bks.push(saved);}
  save("dr11_bks",S.bks);
  var c=calc(saved,S.rate);
  writeToSheets(saved,c,apt);
  bkF=null;bkTab="main";S.editBk=null;S.view="apt";renderApt();
};

/* ══ APT FORM ═══════════════════════════════════════ */
function renderAptForm(){
  if(!aptF){
    aptF=S.editApt?JSON.parse(JSON.stringify(S.editApt)):{id:uid(),apartment_name:"",address:"",mapLink:"",platforms:["Airbnb","Booking"],status:"active",owner_name:"",owner_contact:"",owner_account:"",platform_pct:20,notes:"",utilities:[]};
    if(!aptF.utilities)aptF.utilities=[];
    // Init all providers
    UTIL_PROVIDERS.forEach(function(p){
      if(!aptF.utilities.find(function(u){return u.id===p.id;})){
        aptF.utilities.push({id:p.id,amount:"",provider_option:p.options?p.options[0]:""});
      }
    });
  }
  var a=aptF;
  var pls=a.platforms||[];
  var platHtml=[["Airbnb","pa"],["Booking","pb"],["Другое","po"]].map(function(x){
    return'<button class="plat-btn'+(pls.includes(x[0])?" "+x[1]:"")+'\" onclick="togAptPlat(\''+x[0]+'\')">'+x[0]+'</button>';
  }).join("");
  var utilHtml=(a.utilities||[]).map(function(u,i){
    var prov=UTIL_PROVIDERS.find(function(p){return p.id===u.id;})||{name:u.id,icon:"💡"};
    var optSelect=prov.options?'<select class="sel" style="margin-top:6px" onchange="setUtilOpt('+i+',this.value)">'+prov.options.map(function(o){return'<option value="'+o+'"'+(u.provider_option===o?" selected":"")+'>'+o+'</option>';}).join("")+'</select>':"";
    return'<div class="util-row">'+
      '<div class="f1"><div style="font-size:14px">'+prov.icon+' '+prov.name+'</div>'+(optSelect||"")+'</div>'+
      '<div class="rel" style="width:130px">'+
        '<span class="il" style="font-size:13px">₾</span>'+
        '<input type="number" class="inp pl" value="'+(u.amount||"")+'" placeholder="0" oninput="setUtilAmt('+i+',this.value)" style="font-size:15px"/>'+
      '</div>'+
    '</div>';
  }).join("");

  root.innerHTML=
    '<div class="modal">'+
    '<div class="hdr"><div class="hdr-row">'+
      '<button class="btn" style="background:none;border:none;color:rgba(147,197,253,.5);padding:4px 6px 4px 0" onclick="backFromAptForm()">'+I.back+'</button>'+
      '<div class="f1" style="font-size:15px;font-weight:600">'+(S.editApt?t("editApt"):t("newApt"))+'</div>'+
      '<button class="btn btn-p" onclick="saveApt()">'+I.check+' '+t("save")+'</button>'+
    '</div></div>'+
    '<div class="page">'+
      '<div class="field"><div class="lbl">'+t("aptName")+'</div><input type="text" class="inp" id="a-name" value="'+(a.apartment_name||"")+'" placeholder="Rustaveli Warm Corner"/></div>'+
      '<div class="field"><div class="lbl">'+t("address")+'</div><input type="text" class="inp" id="a-addr" value="'+(a.address||"")+'" placeholder="7 Solomon Zaldastanishvili St"/></div>'+
      '<div class="field"><div class="lbl">'+t("mapLink")+'</div><input type="url" class="inp" id="a-map" value="'+(a.mapLink||"")+'" placeholder="https://maps.google.com/..."/></div>'+
      '<div class="field"><div class="lbl">'+t("platforms")+'</div><div class="plat-row">'+platHtml+'</div></div>'+
      '<div class="field"><div class="lbl">'+t("status")+'</div><select class="sel" id="a-status">'+
        '<option value="active"'+(a.status==="active"?" selected":"")+'>'+t("active")+'</option>'+
        '<option value="inactive"'+(a.status==="inactive"?" selected":"")+'>'+t("inactive")+'</option>'+
      '</select></div>'+
      '<div class="divider"></div>'+
      '<div class="sec">'+t("ownerName").replace("Имя","Владелец").replace("სახელი","მფლობელი")+'</div>'+
      '<div class="field"><div class="lbl">'+t("ownerName")+'</div><input type="text" class="inp" id="a-ownname" value="'+(a.owner_name||"")+'" placeholder="Sophiko"/></div>'+
      '<div class="field"><div class="lbl">'+t("ownerContact")+'</div><input type="text" class="inp" id="a-owncontact" value="'+(a.owner_contact||"")+'" placeholder="+995 599 00 00 00"/></div>'+
      '<div class="field"><div class="lbl">'+t("ownerAccount")+'</div><input type="text" class="inp" id="a-ownacc" value="'+(a.owner_account||"")+'" placeholder="GE29NB0000000101904917" style="font-family:monospace"/></div>'+
      '<div class="field"><div class="lbl">'+t("platShare")+'</div><div class="rel"><input type="number" class="inp pr" id="a-pct" value="'+(a.platform_pct||20)+'"/><span class="ir">%</span></div></div>'+
      '<div class="divider"></div>'+
      '<div class="sec">💡 '+t("utilSection")+'</div>'+
      '<div style="background:#071020;border:1px solid rgba(30,58,110,.5);border-radius:12px;padding:4px 12px;margin-bottom:12px">'+utilHtml+'</div>'+
      '<div class="field"><div class="lbl">'+t("notes")+'</div><textarea class="inp" id="a-notes" rows="3" style="resize:none" placeholder="'+t("notesph")+'">'+(a.notes||"")+'</textarea></div>'+
    '</div>'+
    '</div>';
}

window.togAptPlat=function(p){var pls=aptF.platforms||[];aptF.platforms=pls.includes(p)?pls.filter(function(x){return x!==p;}):[...pls,p];renderAptForm();};
window.setUtilAmt=function(i,v){if(aptF.utilities[i])aptF.utilities[i].amount=v;};
window.setUtilOpt=function(i,v){if(aptF.utilities[i])aptF.utilities[i].provider_option=v;};
window.backFromAptForm=function(){aptF=null;S.editApt=null;S.view=S.selApt?"apt":"list";S.selApt?renderApt():render();};
window.saveApt=function(){
  var name=(g("a-name")||{}).value;if(!name||!name.trim()){alert("Укажите название");return;}
  aptF.apartment_name=name.trim();
  aptF.address=(g("a-addr")||{}).value||"";
  aptF.mapLink=(g("a-map")||{}).value||"";
  aptF.status=(g("a-status")||{}).value||"active";
  aptF.owner_name=(g("a-ownname")||{}).value||"";
  aptF.owner_contact=(g("a-owncontact")||{}).value||"";
  aptF.owner_account=(g("a-ownacc")||{}).value||"";
  aptF.platform_pct=parseFloat((g("a-pct")||{}).value)||20;
  aptF.notes=(g("a-notes")||{}).value||"";
  if(S.editApt){S.apts=S.apts.map(function(a){return a.id===aptF.id?aptF:a;});S.selApt=aptF;}
  else{S.apts.push(aptF);}
  save("dr11_apts",S.apts);
  aptF=null;S.editApt=null;
  S.view=S.selApt?"apt":"list";
  S.selApt?renderApt():render();
};

/* ══ HAPTIC ═════════════════════════════════════════ */
function vibe(){try{if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback){window.Telegram.WebApp.HapticFeedback.impactOccurred("light");}else if(navigator.vibrate){navigator.vibrate(10);}}catch(e){}}
document.addEventListener("touchstart",function(e){var el=e.target.closest("button,a,.apt-card,.bk-main,.tab,.nav-btn,.plat-btn,.cur-btn,.payer-btn,.lang-btn,.fab");if(el)vibe();},{passive:true});

/* ══ START ══════════════════════════════════════════ */
try{if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}}catch(e){}
render();
setTimeout(doSync,500);
</script>
