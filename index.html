<script>
"use strict";
var SHEET_ID="1FyCJedWb0sRAXprDGqRYtkX7s2FYOh4dXkbQAG5BxV0";
var DEF_RATE=2.7;
var EXP_CAT=["cleaning","utilities","supplies","repair","other"];
var EXP_LBL={cleaning:"Уборка",utilities:"Коммуналка",supplies:"Расходники",repair:"Ремонт",other:"Прочее",booking_fee:"Комиссия Booking"};

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var _c=0;
function uid(){return Date.now().toString(36)+(++_c);}
function fN(n){var v=parseFloat(n)||0;return v%1===0?v.toLocaleString("ru-RU"):v.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fD(d){if(!d)return"—";return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit"});}
function fDf(d){if(!d)return"—";return new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"long"});}
function nts(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));}
function nL(n){if(n===1)return"1 ночь";if(n>=2&&n<=4)return n+" ночи";return n+" ночей";}
function g(id){return document.getElementById(id);}

/* ─── CALC ─── */
function calc(b,rate){
  rate=parseFloat(rate)||DEF_RATE;
  var plat=b.platform||"Airbnb";
  var cur=b.income_currency||"USD";
  var gross=parseFloat(b.gross_income)||0;
  // Tax (general, not Airbnb-specific label)
  var taxPct=plat==="Airbnb"?(parseFloat(b.tax_pct)||0):0;
  var tax=parseFloat((gross*taxPct/100).toFixed(2));
  var afterTax=parseFloat((gross-tax).toFixed(2));
  var bookFee=plat==="Booking"?(parseFloat(b.booking_fee)||0):0;
  var exps=(b.expenses||[]).map(function(e){
    var amt=parseFloat(e.amount)||0;
    var inB;
    if(cur==="USD"){inB=e.currency==="USD"?amt:parseFloat((amt/rate).toFixed(2));}
    else{inB=e.currency==="GEL"?amt:parseFloat((amt*rate).toFixed(2));}
    return{id:e.id,cat:e.cat,amount:amt,currency:e.currency,payer:e.payer,comment:e.comment,inB:inB};
  });
  var totalExp=parseFloat(exps.reduce(function(s,e){return s+e.inB;},0).toFixed(2));
  var net=parseFloat((afterTax-totalExp-bookFee).toFixed(2));
  var dPct=parseFloat(b.platform_pct)||20;
  var oPct=100-dPct;
  var dBase=parseFloat((net*dPct/100).toFixed(2));
  var oBase=parseFloat((net*oPct/100).toFixed(2));
  var expPlat=parseFloat(exps.filter(function(e){return e.payer==="platform";}).reduce(function(s,e){return s+e.inB;},0).toFixed(2));
  var expOwn=parseFloat(exps.filter(function(e){return e.payer==="owner";}).reduce(function(s,e){return s+e.inB;},0).toFixed(2));
  var dFin=parseFloat((dBase+expPlat+bookFee).toFixed(2));
  var oFin=parseFloat((oBase+expOwn).toFixed(2));
  return{gross:gross,tax:tax,taxPct:taxPct,afterTax:afterTax,bookFee:bookFee,exps:exps,totalExp:totalExp,net:net,dPct:dPct,oPct:oPct,dBase:dBase,oBase:oBase,expPlat:expPlat,expOwn:expOwn,dFin:dFin,oFin:oFin,cur:cur,plat:plat};
}

/* ─── REPORT ─── */
function makeReport(apt,b,c){
  var S=function(v){return c.cur+" "+fN(v);};
  var n=nts(b.check_in,b.check_out);
  var lines=[
    "🏠 "+(apt?apt.apartment_name:"—"),
    apt&&apt.address?"📍 "+apt.address+", Tbilisi":null,
    "",
    "📅 "+fDf(b.check_in)+" — "+fDf(b.check_out)+" ("+nL(n)+")",
    b.guest_name?"👤 Гость: "+b.guest_name:null,
    "📱 "+c.plat,
    "",
    "💰 Пришло: "+S(c.gross),
    c.tax>0?"📉 Налог ("+c.taxPct+"%): -"+S(c.tax):null,
    c.bookFee>0?"📉 Комиссия Booking: -"+S(c.bookFee):null,
    c.totalExp>0?"🔧 Расходы: -"+S(c.totalExp):null,
  ].concat(c.exps.filter(function(e){return e.inB>0;}).map(function(e){
    return"   • "+(EXP_LBL[e.cat]||e.cat)+": "+e.currency+" "+fN(e.amount)+(e.comment?" ("+e.comment+")":"")+(e.payer==="owner"?" [Собственник]":"");
  })).concat([
    "",
    "✅ Чистая прибыль: "+S(c.net),
    "",
    "👤 Платформа ("+c.dPct+"%): "+S(c.dFin),
    "🏦 "+(apt?apt.owner_name||"Владелец":"Владелец")+" ("+c.oPct+"%): "+S(c.oFin),
    apt&&apt.owner_account?"🏦 Счёт: "+apt.owner_account:null,
    b.comment?"\n💬 "+b.comment:null,
  ]);
  return lines.filter(function(l){return l!==null;}).join("\n");
}

/* ─── ICONS ─── */
var I={
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>',

window.doSync=async function(){
  S.sync="loading";render();
  try{
    var res=await fetch("https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/gviz/tq?tqx=out:json&gid=0");
    var txt=await res.text();
    var json=JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    var cols=json.table.cols.map(function(c){return c.label;});
    var rows=(json.table.rows||[]).map(function(row){
      var o={};cols.forEach(function(c,i){var cell=row.c&&row.c[i];o[c]=cell?(cell.v!==null&&cell.v!==undefined?cell.v:cell.f||""):"";});return o;
    }).filter(function(r){return Object.values(r).some(function(v){return v!=="";});});
    if(rows.length){
      var inc=rows.filter(function(r){return r.apartment_id||r.apartment_name;}).map(function(r){
        return{id:String(r.apartment_id||uid()),apartment_id:r.apartment_id,apartment_name:r.apartment_name||"",address:r.address||"",owner_name:r.owner_name||"",owner_contact:r.owner_contact||"",owner_account:"",platforms:["Airbnb","Booking"],status:"active",platform_pct:20,mapLink:"",notes:""};
      });
      var merged=inc.map(function(s){
        var ex=S.apts.find(function(p){return String(p.id)===String(s.id)||String(p.apartment_id)===String(s.apartment_id);});
        return ex?Object.assign({},ex,{apartment_name:s.apartment_name,address:s.address,owner_name:s.owner_name,owner_contact:s.owner_contact}):s;
      });
      S.apts.forEach(function(p){if(!merged.find(function(m){return String(m.id)===String(p.id);}))merged.push(p);});
      S.apts=merged;save("dr9_apts",S.apts);
    }
    S.sync="ok";S.syncTime=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    setTimeout(function(){S.sync="idle";render();},5000);
  }catch(e){S.sync="err";}
  render();
};

      '<button class="payer-btn'+(payer==="platform"?" pon":"")+'\" onclick="setExpPayer('+idx+',\'platform\')">Платформа</button>'+
      '<button class="payer-btn'+(payer==="owner"?" pon":"")+'\" onclick="setExpPayer('+idx+',\'owner\')">Собственник</button>'+
    '</div>';
  }

  var addCatBtns=cats.filter(function(c){return!usedCats.includes(c);}).map(function(c){
    return'<button class="btn btn-s btn-sm" style="margin:0 4px 6px 0" onclick="addExp(\''+c+'\')">'+I.plus+' '+(EXP_LBL[c]||c)+'</button>';
  }).join("");

  var HOUR_RATE=16.70; // ₾ per hour
  var WITH_HOURS=["cleaning","repair"]; // categories that support hours
  var expRowsSafe=(b.expenses||[]).map(function(e,i){
    var curIcon=e.currency==="GEL"?"₾":"$";
    var curRow='<div class="cur-row">'+
      '<button class="cur-btn'+(e.currency==="USD"?" cusd":"")+'\" onclick="setExpCur('+i+',\'USD\')">USD</button>'+
      '<button class="cur-btn'+(e.currency==="GEL"?" cgel":"")+'\" onclick="setExpCur('+i+',\'GEL\')">GEL</button>'+
    '</div>';
    var hoursBlock="";
    if(WITH_HOURS.indexOf(e.cat)!==-1){
      var hrs=e.hours||"";
      var hoursAmt=hrs?parseFloat((parseFloat(hrs)*HOUR_RATE).toFixed(2)):"";
      hoursBlock=
        '<div style="margin-bottom:8px;background:rgba(30,58,110,.3);border-radius:10px;padding:10px 12px">'+
          '<div class="lbl" style="margin-bottom:6px">⏱ Расчёт по часам (1ч = 16.70 ₾)</div>'+
          '<div style="display:flex;gap:8px;align-items:center">'+
            '<div class="f1 rel">'+
              '<span class="il" style="font-size:12px">ч</span>'+
              '<input type="number" class="inp pl" value="'+hrs+'" placeholder="0" step="0.5" style="font-size:16px" oninput="setExpHours('+i+',this.value)"/>'+
            '</div>'+
            (hoursAmt?'<div style="font-size:13px;color:#6ee7b7;font-family:monospace;font-weight:700;white-space:nowrap">= ₾ '+fN(hoursAmt)+'</div>':'<div style="font-size:12px;color:rgba(147,197,253,.3)">введите часы</div>')+
          '</div>'+
          (hoursAmt?'<button class="btn btn-s btn-sm" style="width:100%;margin-top:8px" onclick="applyHours('+i+')">Применить сумму</button>':"")+
        '</div>';
    }
    return'<div class="exp-block">'+
      '<div class="row" style="margin-bottom:10px">'+
        '<span style="font-size:13px;font-weight:600;flex:1">'+(EXP_LBL[e.cat]||e.cat)+'</span>'+
        '<button class="btn btn-d btn-sm" style="padding:4px 8px" onclick="delExp('+i+')">'+I.trash+'</button>'+
      '</div>'+
      hoursBlock+
      '<div class="field" style="display:flex;gap:8px;align-items:flex-end">'+
        '<div class="f1 rel"><span class="il">'+curIcon+'</span><input type="number" class="inp pl" value="'+(e.amount||"")+'" placeholder="0" oninput="setExpAmt('+i+',this.value)"/></div>'+
        curRow+
      '</div>'+
      '<div class="field"><div class="lbl">Кто оплатил</div>'+payerBtns(e.payer,i)+'</div>'+
      '<input type="text" class="inp" value="'+(e.comment||"")+'" placeholder="Комментарий..." oninput="setExpComment('+i+',this.value)" style="margin-top:8px"/>'+
    '</div>';
  }).join("");

  var rpt=makeReport(apt,b,c);

  var mainHtml=
    '<div class="g2 field">'+
      '<div><div class="lbl">Заезд</div><input type="date" class="inp" id="f-ci" value="'+b.check_in+'" onchange="bkF.check_in=this.value;rerenderCalc()"/></div>'+
      '<div><div class="lbl">Выезд</div><input type="date" class="inp" id="f-co" value="'+b.check_out+'" onchange="bkF.check_out=this.value;rerenderCalc()"/></div>'+
    '</div>'+
    (n>0?'<div class="night-pill">'+nL(n)+'</div>':"")+
    '<div class="field"><div class="lbl">Имя гостя</div><input type="text" class="inp" value="'+b.guest_name+'" placeholder="Giorgi M." oninput="bkF.guest_name=this.value"/></div>'+
    '<div class="field"><div class="lbl">Платформа</div><div class="plat-row">'+platHtml+'</div></div>'+
    '<div class="field">'+
      '<div class="lbl">Сумма поступления</div>'+
      '<div style="display:flex;gap:8px;align-items:flex-end">'+
        '<div class="f1 rel"><span class="il">'+(b.income_currency==="GEL"?"₾":"$")+'</span><input type="number" class="inp pl" value="'+b.gross_income+'" placeholder="0" oninput="bkF.gross_income=this.value;rerenderCalc()"/></div>'+
        '<div class="cur-row">'+
          '<button class="cur-btn'+(b.income_currency==="USD"?" cusd":"")+'\" onclick="setIncomeCur(\'USD\')">USD</button>'+
          '<button class="cur-btn'+(b.income_currency==="GEL"?" cgel":"")+'\" onclick="setIncomeCur(\'GEL\')">GEL</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    (b.platform==="Booking"?'<div class="field"><div class="lbl">Комиссия Booking</div><div class="rel"><span class="il">$</span><input type="number" class="inp pl" value="'+(b.booking_fee||"")+'" placeholder="0" oninput="bkF.booking_fee=this.value;rerenderCalc()"/></div></div>':"")+
    '<div class="g2 field">'+
      '<div><div class="lbl">Доля платформы (%)</div><div class="rel"><input type="number" class="inp pr" value="'+b.platform_pct+'" oninput="bkF.platform_pct=this.value;rerenderCalc()"/><span class="ir">%</span></div></div>'+
      '<div><div class="lbl">Статус</div><select class="sel" onchange="bkF.payment_status=this.value">'+
        ['received:✓ Получено','pending:⏳ Ожидается','partial:◑ Частично'].map(function(x){var p=x.split(":");return'<option value="'+p[0]+'"'+(b.payment_status===p[0]?" selected":"")+'>'+p[1]+'</option>';}).join("")+
      '</select></div>'+
    '</div>'+
    (c.gross>0?'<div class="field" id="calc-live">'+calcBoxHtml(c,apt&&apt.owner_name)+'</div>':'')+
    '<div class="field"><div class="lbl">Комментарий</div><textarea class="inp" rows="3" style="resize:none" placeholder="Заметки..." oninput="bkF.comment=this.value">'+b.comment+'</textarea></div>';

  var expHtml=
    '<div class="sec">Добавить категорию</div>'+
    '<div style="margin-bottom:12px">'+addCatBtns+'</div>'+
    expRowsSafe+
    (!expRowsSafe?'<div class="empty" style="padding:20px">Расходов нет</div>':"")+
    '<div class="divider"></div>'+
    '<div class="lbl" style="margin-bottom:8px">Чеки и фото</div>'+
    '<div class="receipt-grid">'+
      (b.receipts||[]).map(function(r,i){return'<div style="position:relative"><img src="'+r.data+'" class="thumb" onclick="window.open(this.src)"/><button onclick="delReceipt('+i+')" style="position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#ef4444;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer">'+I.x+'</button></div>';}).join("")+
      '<button class="add-thumb" onclick="g(\'file-inp\').click()">'+I.img+'<span>Фото</span></button>'+
    '</div>'+
    '<input type="file" id="file-inp" accept="image/*" multiple style="display:none" onchange="addReceipts(this)"/>'+
    (c.gross>0?'<div style="margin-top:12px">'+calcBoxHtml(c,apt&&apt.owner_name)+'</div>':"");

  var rptHtml=
    '<div class="card pad field"><div class="sec">Превью отчёта</div><div class="rpt">'+rpt+'</div></div>'+
    (apt&&apt.owner_account?'<div class="card pad field" style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#4a6fa0">Счёт:</span><span style="font-family:monospace;font-size:12px;color:#93c5fd">'+apt.owner_account+'</span></div>':"")+
    '<div class="field"><button id="copy-btn" class="btn btn-s" style="width:100%">'+I.copy+' Копировать отчёт</button></div>';

  root.innerHTML=
    '<div class="modal">'+
    '<div class="hdr"><div class="hdr-row">'+
      '<button class="btn" style="background:none;border:none;color:rgba(147,197,253,.5);padding:4px 6px 4px 0" onclick="backFromBkForm()">'+I.back+'</button>'+
      '<div class="f1"><div class="muted" style="font-size:12px">'+(apt?apt.apartment_name:"")+'</div>'+
        '<div style="font-size:15px;font-weight:600">'+(S.editBk?"Редактировать":"Новое проживание")+'</div></div>'+
      '<button class="btn btn-p" onclick="saveBk()">'+I.check+' Сохранить</button>'+
    '</div></div>'+
    '<div class="tabs">'+['Основное:main','Расходы:exp','Отчёт:rpt'].map(function(x){var p=x.split(":");return'<button class="tab'+(bkTab===p[1]?" on":"")+'\" onclick="switchBkTab(\''+p[1]+'\')">'+p[0]+'</button>';}).join("")+'</div>'+
    '<div class="page">'+(bkTab==="main"?mainHtml:bkTab==="exp"?expHtml:rptHtml)+'</div>'+
    '</div>';

  if(g("copy-btn")){
    g("copy-btn").addEventListener("click",function(){
      navigator.clipboard.writeText(rpt).catch(function(){});
      g("copy-btn").innerHTML=I.check+' Скопировано!';
      setTimeout(function(){if(g("copy-btn"))g("copy-btn").innerHTML=I.copy+' Копировать отчёт';},2000);
    });
  }
}

window.rerenderCalc=function(){
  if(!bkF||bkTab!=="main")return;
  var apt=S.selApt;
  var c=calc(bkF,S.rate);
  var el=g("calc-live");
  if(c.gross>0){
    if(el){el.innerHTML=calcBoxHtml(c,apt&&apt.owner_name);}
    else{
      var pg=document.querySelector(".modal .page");
      if(pg){var d=document.createElement("div");d.id="calc-live";d.className="field";d.innerHTML=calcBoxHtml(c,apt&&apt.owner_name);var ta=pg.querySelector("textarea");if(ta&&ta.parentNode)pg.insertBefore(d,ta.parentNode);else pg.appendChild(d);}
    }
  }
};
window.backFromBkForm=function(){bkF=null;bkTab="main";S.editBk=null;S.view="apt";renderApt();};
window.switchBkTab=function(t){bkTab=t;renderBkForm();};
window.setBkPlat=function(p){bkF.platform=p;bkF.income_currency=p==="Airbnb"?"USD":"GEL";renderBkForm();};
window.setIncomeCur=function(c){bkF.income_currency=c;renderBkForm();};
window.addExp=function(cat){
  bkF.expenses=bkF.expenses||[];
  bkF.expenses.push({id:uid(),cat:cat,amount:"",currency:bkF.income_currency||"USD",payer:"platform",comment:""});
  renderBkForm();
};
window.delExp=function(i){bkF.expenses.splice(i,1);renderBkForm();};
window.setExpAmt=function(i,v){if(bkF.expenses[i])bkF.expenses[i].amount=v;};
window.setExpHours=function(i,v){
  if(!bkF.expenses[i])return;
  bkF.expenses[i].hours=v;
  // live update the preview label without full rerender
  renderBkForm();
};
window.applyHours=function(i){
  if(!bkF.expenses[i])return;
  var hrs=parseFloat(bkF.expenses[i].hours)||0;
  var amt=parseFloat((hrs*16.70).toFixed(2));
  bkF.expenses[i].amount=amt;
  bkF.expenses[i].currency="GEL";
  renderBkForm();
};
window.setExpCur=function(i,v){if(bkF.expenses[i]){bkF.expenses[i].currency=v;renderBkForm();}};
window.setExpPayer=function(i,v){if(bkF.expenses[i]){bkF.expenses[i].payer=v;renderBkForm();}};
window.setExpComment=function(i,v){if(bkF.expenses[i])bkF.expenses[i].comment=v;};
window.addReceipts=function(inp){
  var files=Array.from(inp.files);var done=0;
  files.forEach(function(f){
    var r=new FileReader();
    r.onload=function(ev){bkF.receipts=bkF.receipts||[];bkF.receipts.push({id:uid(),name:f.name,data:ev.target.result});done++;if(done===files.length)renderBkForm();};
    r.readAsDataURL(f);
  });
  inp.value="";
};
window.delReceipt=function(i){bkF.receipts.splice(i,1);renderBkForm();};
window.saveBk=function(){
  if(!bkF)return;
  var saved=Object.assign({},bkF,{aptId:S.selApt.id});
  if(S.editBk){S.bks=S.bks.map(function(b){return b.id===saved.id?saved:b;});}
  else{S.bks.push(saved);}
  save("dr9_bks",S.bks);
  bkF=null;bkTab="main";S.editBk=null;S.view="apt";renderApt();
};

/* ─── APT FORM ─── */
function renderAptForm(){
  if(!aptF){
    aptF=S.editApt?JSON.parse(JSON.stringify(S.editApt)):{id:uid(),apartment_name:"",address:"",mapLink:"",platforms:["Airbnb","Booking"],status:"active",owner_name:"",owner_contact:"",owner_account:"",platform_pct:20,notes:""};
  }
  var a=aptF;
  var pls=a.platforms||[];
  var platHtml=[["Airbnb","pa"],["Booking","pb"],["Другое","po"]].map(function(x){
    return'<button class="plat-btn'+(pls.includes(x[0])?" "+x[1]:"")+'\" onclick="togAptPlat(\''+x[0]+'\')">'+x[0]+'</button>';
  }).join("");
  root.innerHTML=
    '<div class="modal">'+
    '<div class="hdr"><div class="hdr-row">'+
      '<button class="btn" style="background:none;border:none;color:rgba(147,197,253,.5);padding:4px 6px 4px 0" onclick="backFromAptForm()">'+I.back+'</button>'+
      '<div class="f1" style="font-size:15px;font-weight:600">'+(S.editApt?"Редактировать квартиру":"Новая квартира")+'</div>'+
      '<button class="btn btn-p" onclick="saveApt()">'+I.check+' Сохранить</button>'+
    '</div></div>'+
    '<div class="page">'+
      '<div class="field"><div class="lbl">Название</div><input type="text" class="inp" id="a-name" value="'+(a.apartment_name||"")+'" placeholder="Rustaveli Warm Corner"/></div>'+
      '<div class="field"><div class="lbl">Адрес</div><input type="text" class="inp" id="a-addr" value="'+(a.address||"")+'" placeholder="7 Solomon Zaldastanishvili St"/></div>'+
      '<div class="field"><div class="lbl">Ссылка на карту</div><input type="url" class="inp" id="a-map" value="'+(a.mapLink||"")+'" placeholder="https://maps.google.com/..."/></div>'+
      '<div class="field"><div class="lbl">Платформы</div><div class="plat-row">'+platHtml+'</div></div>'+
      '<div class="field"><div class="lbl">Статус</div><select class="sel" id="a-status">'+
        '<option value="active"'+(a.status==="active"?" selected":"")+'>Активна</option>'+
        '<option value="inactive"'+(a.status==="inactive"?" selected":"")+'>Неактивна</option>'+
      '</select></div>'+
      '<div class="divider"></div>'+
      '<div class="sec">Владелец</div>'+
      '<div class="field"><div class="lbl">Имя</div><input type="text" class="inp" id="a-ownname" value="'+(a.owner_name||"")+'" placeholder="Sophiko"/></div>'+
      '<div class="field"><div class="lbl">Контакт</div><input type="text" class="inp" id="a-owncontact" value="'+(a.owner_contact||"")+'" placeholder="+995 599 00 00 00"/></div>'+
      '<div class="field"><div class="lbl">Счёт / реквизиты</div><input type="text" class="inp" id="a-ownacc" value="'+(a.owner_account||"")+'" placeholder="GE29NB0000000101904917" style="font-family:monospace"/></div>'+
      '<div class="field"><div class="lbl">Доля платформы (%)</div><div class="rel"><input type="number" class="inp pr" id="a-pct" value="'+(a.platform_pct||20)+'"/><span class="ir">%</span></div></div>'+
      '<div class="field"><div class="lbl">Заметки</div><textarea class="inp" id="a-notes" rows="3" style="resize:none">'+(a.notes||"")+'</textarea></div>'+
    '</div>'+
    '</div>';
}
window.togAptPlat=function(p){var pls=aptF.platforms||[];aptF.platforms=pls.includes(p)?pls.filter(function(x){return x!==p;}):[...pls,p];renderAptForm();};
window.backFromAptForm=function(){aptF=null;S.editApt=null;S.view=S.selApt?"apt":"list";S.selApt?renderApt():render();};
window.saveApt=function(){
  var name=(g("a-name")||{}).value;if(!name||!name.trim()){alert("Укажите название");return;}
  aptF.apartment_name=name.trim();
  aptF.address=(g("a-addr")||{}).value||"";
  aptF.mapLink=(g("a-map")||{}).value||"";
  aptF.status=(g("a-status")||{}).value||"active";
  aptF.owner_name=(g("a-ownname")||{}).value||"";
  aptF.owner_contact=(g("a-owncontact")||{}).value||"";
  aptF.owner_account=(g("a-ownacc")||{}).value||"";
  aptF.platform_pct=parseFloat((g("a-pct")||{}).value)||20;
  aptF.notes=(g("a-notes")||{}).value||"";
  if(S.editApt){S.apts=S.apts.map(function(a){return a.id===aptF.id?aptF:a;});S.selApt=aptF;}
  else{S.apts.push(aptF);}
  save("dr9_apts",S.apts);
  aptF=null;S.editApt=null;
  S.view=S.selApt?"apt":"list";
  S.selApt?renderApt():render();
};

/* ─── HAPTIC ─── */
function vibe(){
  try{
    if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback){
      window.Telegram.WebApp.HapticFeedback.impactOccurred("light");
    } else if(navigator.vibrate){
      navigator.vibrate(10);
    }
  }catch(e){}
}
// Attach haptic to all taps globally
document.addEventListener("touchstart",function(e){
  var el=e.target.closest("button,a,.apt-card,.bk-main,.tab,.nav-btn,.plat-btn,.cur-btn,.payer-btn,.fab");
  if(el)vibe();
},{passive:true});

/* ─── START ─── */
try{if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}}catch(e){}
render();
setTimeout(doSync,500);
</script>
</body>
</html>
