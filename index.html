<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>ApartFlow</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:inherit;font-size:16px}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::-webkit-scrollbar{width:2px}::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
select option{background:#1c1c1e;color:#fff}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator,
input[type=month]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.4}

/* ── Layout ── */
#root{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 16px 96px}
.modal{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;z-index:50;overflow:hidden}
.modal>.page{padding-bottom:24px}

/* ── Header ── */
.hdr{background:#1c1c1e;border-bottom:1px solid rgba(255,255,255,.06);padding:14px 16px;flex-shrink:0}
.hdr-row{display:flex;align-items:center;gap:12px}

/* ── Tabs ── */
.tabs{display:flex;background:#111;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.tab{flex:1;padding:13px 4px;font-size:11px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:rgba(255,255,255,.28);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s}
.tab.on{color:#fff;border-bottom-color:#fff}

/* ── Nav ── */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(17,17,17,.95);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:1px solid rgba(255,255,255,.07);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;font-size:9px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.28);background:none;border:none;cursor:pointer;transition:color .15s}
.nav-btn.on{color:#fff}

/* ── Cards ── */
.card{background:#1c1c1e;border-radius:16px}
.pad{padding:16px}
.bk-card{background:#1c1c1e;border-radius:16px;overflow:hidden;margin-bottom:10px}
.bk-main{padding:15px 16px;cursor:pointer;transition:background .1s}
.bk-main:active{background:rgba(255,255,255,.04)}
.bk-body{border-top:1px solid rgba(255,255,255,.06);padding:15px 16px;background:#161616}
.apt-item{background:#1c1c1e;border-radius:16px;padding:0;margin-bottom:10px;cursor:pointer;overflow:hidden;transition:transform .1s}
.apt-item:active{transform:scale(.985)}

/* ── Owner amount highlight ── */
.owner-amount{font-size:26px;font-weight:700;letter-spacing:-.5px;color:#34c759}

/* ── Form ── */
.field{margin-bottom:14px}
.lbl{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
.inp{width:100%;background:#2c2c2e;border:none;border-radius:12px;padding:13px 14px;font-size:16px;color:#fff;outline:none;-webkit-appearance:none;transition:box-shadow .15s}
.inp:focus{box-shadow:0 0 0 2px rgba(255,255,255,.2)}
.inp::placeholder{color:rgba(255,255,255,.2)}
.inp.pl{padding-left:38px}
.inp.pr{padding-right:38px}
.sel{width:100%;background:#2c2c2e;border:none;border-radius:12px;padding:13px 14px;font-size:16px;color:#fff;outline:none;-webkit-appearance:none}
.rel{position:relative}
.il{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);pointer-events:none;font-size:15px;font-weight:600}
.ir{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);pointer-events:none;font-size:13px;font-weight:600}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;cursor:pointer;-webkit-appearance:none;border-radius:12px;transition:opacity .1s}
.btn:active{opacity:.6}
.btn-p{background:#fff;border:none;color:#000;padding:12px 18px;font-size:14px;font-weight:700}
.btn-s{background:#2c2c2e;border:none;color:#fff;padding:12px 18px;font-size:14px}
.btn-d{background:rgba(255,69,58,.12);border:none;color:#ff453a;padding:8px 14px;font-size:13px;border-radius:10px}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:10px}
.fab-bar{background:#1c1c1e;border-top:1px solid rgba(255,255,255,.06);padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));flex-shrink:0}
.fab{width:100%;background:#fff;border:none;color:#000;border-radius:14px;padding:15px;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;-webkit-appearance:none}
.fab:active{opacity:.7}

/* ── Badges ── */
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.g{background:rgba(52,199,89,.15);color:#34c759}
.gy{background:rgba(142,142,147,.15);color:#8e8e93}
.or{background:rgba(255,149,0,.15);color:#ff9500}
.bl{background:rgba(10,132,255,.15);color:#0a84ff}
.ok{background:rgba(52,199,89,.15);color:#34c759}
.wt{background:rgba(255,69,58,.15);color:#ff453a}
.pt{background:rgba(255,214,10,.15);color:#ffd60a}
.yw{background:rgba(255,214,10,.12);color:#ffd60a}

/* ── Segment controls (platform, currency, payer) ── */
.plat-row{display:flex;gap:8px}
.plat-btn{flex:1;padding:11px 8px;border-radius:12px;font-size:14px;font-weight:600;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer;text-align:center;-webkit-appearance:none;transition:all .15s}
.plat-btn:active{opacity:.7}
.pa{background:rgba(255,149,0,.15);color:#ff9500}
.pb{background:rgba(10,132,255,.15);color:#0a84ff}
.po{background:rgba(142,142,147,.15);color:#8e8e93}
.cur-row{display:flex;gap:6px}
.cur-btn{flex:1;padding:10px 6px;border-radius:10px;font-size:14px;font-weight:700;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer;-webkit-appearance:none;transition:all .15s;text-align:center}
.cur-btn:active{opacity:.7}
.cusd{background:rgba(255,214,10,.12);color:#ffd60a}
.cgel{background:rgba(52,199,89,.12);color:#34c759}
.payer-row{display:flex;gap:8px}
.payer-btn{flex:1;padding:11px 6px;border-radius:10px;font-size:13px;font-weight:600;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer;text-align:center;-webkit-appearance:none;transition:all .15s}
.payer-btn:active{opacity:.7}
.pon{background:rgba(10,132,255,.15);color:#0a84ff}
.lang-btn{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:600;border:none;background:#2c2c2e;color:rgba(255,255,255,.35);cursor:pointer;-webkit-appearance:none;transition:all .15s}
.lang-btn.on{background:rgba(10,132,255,.2);color:#0a84ff}

/* ── Calc box ── */
.cbox{background:#161616;border-radius:14px;overflow:hidden}
.crow{display:flex;justify-content:space-between;align-items:center;padding:9px 14px}
.crow.sub{padding-left:26px}
.crow.net-row{background:#1c1c1e}
.cl{font-size:13px;color:rgba(255,255,255,.45)}
.cv{font-size:13px;font-family:-apple-system,monospace;font-weight:600;color:#fff}
.cv.neg{color:#ff453a}.cv.em{color:#34c759}.cv.tbl{color:#0a84ff}.cv.big{font-size:16px;font-weight:700}
.cdiv{height:1px;background:rgba(255,255,255,.06)}

/* ── Expense block ── */
.exp-block{background:#1c1c1e;border-radius:14px;padding:14px;margin-bottom:10px}

/* ── Report ── */
.rpt{font-family:'SF Mono',monospace;font-size:12px;line-height:1.8;color:rgba(255,255,255,.7);background:#161616;border-radius:12px;padding:14px;white-space:pre-wrap;word-break:break-word}

/* ── Misc ── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.f1{flex:1;min-width:0}.fs0{flex-shrink:0}
.tr{text-align:right}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:rgba(255,255,255,.35);font-size:12px}
.wrap{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.empty{text-align:center;padding:48px 16px;color:rgba(255,255,255,.2);font-size:15px}
.loading{text-align:center;padding:60px 16px;color:rgba(255,255,255,.25)}
.spin-icon{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Sync bar ── */
.sync-bar{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12px;flex-shrink:0}
.sync-ok{background:rgba(52,199,89,.07);border-bottom:1px solid rgba(52,199,89,.12);color:#34c759}
.sync-err{background:rgba(255,69,58,.07);border-bottom:1px solid rgba(255,69,58,.12);color:#ff453a}
.sync-ing{background:rgba(10,132,255,.07);border-bottom:1px solid rgba(10,132,255,.12);color:#0a84ff}

/* ── Owner strip in apt detail ── */
.owner-strip{display:flex;align-items:center;gap:12px;background:#1c1c1e;border-radius:12px;padding:12px 14px;margin-top:10px}
.ow-av{width:30px;height:30px;border-radius:50%;background:#2c2c2e;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:rgba(255,255,255,.6);flex-shrink:0}

/* ── Rate pill ── */
.rate-pill{display:flex;align-items:center;gap:5px;background:#2c2c2e;border-radius:10px;padding:7px 11px}

/* ── Section title ── */
.sec{font-size:11px;font-weight:600;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.divider{height:1px;background:rgba(255,255,255,.06);margin:14px 0}

/* ── Receipts ── */
.receipt-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.thumb{width:68px;height:68px;border-radius:12px;object-fit:cover;cursor:pointer}
.add-thumb{width:68px;height:68px;border-radius:12px;background:#2c2c2e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:rgba(255,255,255,.25);cursor:pointer;border:none;font-size:11px;-webkit-appearance:none}

/* ── Night pill ── */
.night-pill{text-align:center;background:#2c2c2e;border-radius:12px;padding:10px;color:rgba(255,255,255,.7);font-size:15px;font-weight:600;margin-bottom:14px}

/* ── Hours block ── */
.hours-block{background:#2c2c2e;border-radius:12px;padding:12px 14px;margin-bottom:10px}

/* ── Currency blocks in stats ── */
.cur-block{border-radius:14px;overflow:hidden;margin-bottom:10px}
.cur-hdr{padding:10px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.cur-row-s{display:flex;justify-content:space-between;padding:8px 14px;font-size:14px;border-top:1px solid rgba(255,255,255,.06)}
.total-bar{background:#1c1c1e;border-radius:14px;padding:14px;margin-bottom:12px}

/* ── Status buttons ── */
.status-btn{flex:1;padding:10px 6px;border-radius:10px;font-size:12px;font-weight:600;border:none;background:#2c2c2e;color:rgba(255,255,255,.3);cursor:pointer;text-align:center;-webkit-appearance:none;transition:all .15s}
.status-btn.s-free{background:rgba(52,199,89,.15);color:#34c759}
.status-btn.s-busy{background:rgba(255,69,58,.15);color:#ff453a}
.status-btn.s-clean{background:rgba(255,214,10,.12);color:#ffd60a}
.status-btn.s-tech{background:rgba(142,142,147,.15);color:#8e8e93}

/* ── Cleaning card ── */
.clean-card{background:#1c1c1e;border-radius:14px;padding:14px;margin-bottom:10px}

/* ── Apt card inner ── */
.apt-inner{padding:14px 16px}
.apt-owner-bar{padding:10px 16px;background:#161616;border-top:1px solid rgba(255,255,255,.05);display:flex;align-items:center;justify-content:space-between}
</style>
</head>

<script>
"use strict";

/* ══ CONFIG ════════════════════════════════════════════════ */
var GAS_URL = "https://script.google.com/macros/s/AKfycbzuB89o-_deQGjgZHiJNjiZ5IZvON4aFBeEdBg6U98aT-lt_eZkaS7lkQqay2xvikoH/exec";
var SYNC_INTERVAL = 45000; // 45 sec auto-refresh
var HOUR_RATE = 16.70;

var EXP_LBL = {

  {key:"free",  label:"Свободно", cls:"s-free"},
  {key:"busy",  label:"Занято",   cls:"s-busy"},
  {key:"clean", label:"Уборка",   cls:"s-clean"},
  {key:"tech",  label:"Техническое", cls:"s-tech"},
];

/* ══ I18N ═══════════════════════════════════════════════════ */
var L = {
  ru:{apts:"Квартиры",analytics:"Аналитика",cleaning:"Уборки",
    arrived:"Пришло",platform:"Платформа",owner:"Владелец",net:"Чистая прибыль",

    newCleaning:"Новая уборка",cleaner:"Уборщик",startTime:"Начало",endTime:"Конец",
    totalH:"Итого часов",rate:"Ставка ₾/ч",total_amount:"Сумма",
    clean:"Чист.",stays:"прожив.",loading:"Загрузка...",syncing:"Синхронизация...",
    syncOk:"Синхронизировано",syncErr:"Ошибка",retry:"Повторить",
    rptPeriod:"Период",rptGuest:"Гость",rptPlat:"Платформа",
    rptArrived:"Пришло",rptTax:"Налог",rptFee:"Комиссия Booking",
    rptExp:"Расходы",rptNet:"Чистая прибыль",rptAcc:"Счёт",
    reportLang:"Язык отчёта",
  },
  ka:{apts:"ბინები",analytics:"ანალიტიკა",cleaning:"დასუფთავება",
    arrived:"მიღებული",platform:"პლატფორმა",owner:"მფლობელი",net:"სუფთა მოგება",
    expenses:"ხარჯები",total:"სულ USD",byRate:"კურსი",
    noApts:"ობიექტები არ არის. დაამატეთ Google Sheets-ში.",
    noBookings:"ჩასახლება არ არის",addBooking:"ჩასახლების დამატება",

    comment:"კომენტარი",rpt:"ანგარიში",copyRpt:"კოპირება",copied:"დაკოპირდა!",

function t(k){return(L[DB.lang]||L.ru)[k]||k;}

/* ══ DB (single source of truth) ══════════════════════════ */
var DB = {
  lang: lsGet("lang","ru"),
  rate: lsGet("rate", 2.70),
  apartments: lsGet("apartments", []),
  bookings:   lsGet("bookings",   []),
  expenses:   lsGet("expenses",   []),
  cleaning:   lsGet("cleaning",   []),
  staff:      lsGet("staff",      []),
  syncState:  "idle",  // idle | loading | ok | err
  syncTime:   null,
  lastFull:   lsGet("lastFull", null),
};

/* ══ STORAGE ════════════════════════════════════════════════ */
function lsGet(k,d){try{var v=localStorage.getItem("af_"+k);return v?JSON.parse(v):d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem("af_"+k,JSON.stringify(v));}catch(e){}}
function dbSave(){
  lsSet("lang",DB.lang);lsSet("rate",DB.rate);
  lsSet("apartments",DB.apartments);lsSet("bookings",DB.bookings);
  lsSet("expenses",DB.expenses);lsSet("cleaning",DB.cleaning);
  lsSet("staff",DB.staff);lsSet("lastFull",DB.lastFull);
}

var _c=0;
function uid(){return Date.now().toString(36)+(++_c);}

/* ══ UTILS ══════════════════════════════════════════════════ */
function fN(n){var v=parseFloat(n)||0;return v%1===0?v.toLocaleString("ru-RU"):v.toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fD(d){if(!d)return"—";var s=String(d);if(s.includes("T"))s=s.slice(0,10);return new Date(s+"T12:00:00").toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit"});}
function fDf(d,lng){if(!d)return"—";var s=String(d);if(s.includes("T"))s=s.slice(0,10);return new Date(s+"T12:00:00").toLocaleDateString(lng==="ka"?"ka-GE":"ru-RU",{day:"2-digit",month:"long"});}
function nts(a,b){if(!a||!b)return 0;return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));}
function nL(n){if(n===1)return"1 ночь";if(n>=2&&n<=4)return n+" ночи";return n+" ночей";}
function cs(c){return c==="GEL"?"₾":"$";}
function toUSD(v,cur,rate){return cur==="USD"?v:parseFloat((v/rate).toFixed(2));}
function g(id){return document.getElementById(id);}

/* ══ API ════════════════════════════════════════════════════ */
async function apiGet(){
  var res = await fetch(GAS_URL+"?v="+Date.now());
  var json = await res.json();
  if(!json.ok) throw new Error(json.error);
  return json.data;
}
async function apiPost(action, data){
  var res = await fetch(GAS_URL, {
    method:"POST",

/* ══ CALC ═══════════════════════════════════════════════════ */
function calc(bk){
  var rate=DB.rate;
  var plat=bk.platform||"Airbnb";
  // Use stored currency; if missing, infer from platform
  var cur=bk.income_currency||(plat==="Airbnb"?"USD":"GEL");
  var gross=parseFloat(bk.gross_income)||0;
  var taxPct=plat==="Airbnb"?(parseFloat(bk.tax_pct)||0):0;
  var tax=parseFloat((gross*taxPct/100).toFixed(2));
  var afterTax=parseFloat((gross-tax).toFixed(2));
  var bookFee=plat==="Booking"?(parseFloat(bk.booking_fee)||0):0;
  var exps=DB.expenses.filter(function(e){return e.booking_id===bk.id;}).map(function(e){
    var amt=parseFloat(e.amount)||0;
    var inBase=cur==="USD"?(e.currency==="USD"?amt:parseFloat((amt/rate).toFixed(2))):(e.currency==="GEL"?amt:parseFloat((amt*rate).toFixed(2)));
    return Object.assign({},e,{amt:amt,inBase:inBase});
  });
  var totalExp=parseFloat(exps.reduce(function(s,e){return s+e.inBase;},0).toFixed(2));
  var net=parseFloat((afterTax-totalExp-bookFee).toFixed(2));
  var dPct=parseFloat(bk.platform_pct)||20;
  var oPct=100-dPct;
  var dBase=parseFloat((net*dPct/100).toFixed(2));
  var oBase=parseFloat((net*oPct/100).toFixed(2));
  var expPlat=parseFloat(exps.filter(function(e){return e.payer==="platform";}).reduce(function(s,e){return s+e.inBase;},0).toFixed(2));
  var expOwn=parseFloat(exps.filter(function(e){return e.payer==="owner";}).reduce(function(s,e){return s+e.inBase;},0).toFixed(2));
  var dFin=parseFloat((dBase+expPlat+bookFee).toFixed(2));
  var oFin=parseFloat((oBase+expOwn).toFixed(2));
  return{gross:gross,tax:tax,taxPct:taxPct,bookFee:bookFee,exps:exps,totalExp:totalExp,net:net,dPct:dPct,oPct:oPct,dBase:dBase,oBase:oBase,expPlat:expPlat,expOwn:expOwn,dFin:dFin,oFin:oFin,cur:cur,plat:plat,
    grossUSD:toUSD(gross,cur,DB.rate),netUSD:toUSD(net,cur,DB.rate),dFinUSD:toUSD(dFin,cur,DB.rate),oFinUSD:toUSD(oFin,cur,DB.rate)};
}

function makeReport(apt,bk,c,lng){
  lng=lng||"ru";
  var tL=L[lng]||L.ru;
  var S=function(v){return cs(c.cur)+fN(v);};
  var n=nts(bk.check_in,bk.check_out);
  var nLabel=lng==="ka"?(n+" ღამე"):nL(n);
  var ELK={cleaning:"დასუფთავება",telmico:"💧 Telmico",gwp:"🔥 GWP",energy:"⚡ Tbilisi Energy",internet:"🌐 Internet",tbilisi_clean:"🗑 Tbilisi Clean",supplies:"მასალები",repair:"რემონტი",other:"სხვა",booking_fee:"Booking-ის საკომისიო"};
  var expLines=c.exps.filter(function(e){return e.inBase>0;}).map(function(e){
    return"   • "+((lng==="ka"?ELK:EXP_LBL)[e.category||e.cat]||e.category||e.cat)+": "+cs(e.currency)+fN(e.amt)+(e.comment?" ("+e.comment+")":"")+(e.payer==="owner"?" ["+tL.nbySelf+"]":"");
  });
  return [
    "🏠 "+(apt?apt.apartment_name:"—"),
    apt&&apt.address?"📍 "+apt.address+", Tbilisi":null,
    "",
    "📅 "+tL.rptPeriod+": "+fDf(bk.check_in,lng)+" — "+fDf(bk.check_out,lng)+" ("+nLabel+")",
    bk.guest_name?"👤 "+tL.rptGuest+": "+bk.guest_name:null,
    "📱 "+tL.rptPlat+": "+c.plat,
    "",
    "💰 "+tL.rptArrived+": "+S(c.gross),
    c.tax>0?"📉 "+tL.rptTax+" ("+c.taxPct+"%): -"+S(c.tax):null,
    c.bookFee>0?"📉 "+tL.rptFee+": -"+S(c.bookFee):null,
    c.totalExp>0?"🔧 "+tL.rptExp+": -"+S(c.totalExp):null,
  ].concat(expLines).concat([
    "",
    "✅ "+tL.rptNet+": "+S(c.net),
    "",
    "👤 "+tL.platform+" ("+c.dPct+"%): "+S(c.dFin),
    "🏦 "+(apt?apt.owner_name||tL.owner:tL.owner)+" ("+c.oPct+"%): "+S(c.oFin),
    apt&&apt.owner_account?"🏦 "+tL.rptAcc+": "+apt.owner_account:null,
    bk.comment?"\n💬 "+bk.comment:null,
  ]).filter(function(l){return l!==null;}).join("\n");
}

window.setStatus=async function(st){
  var apt=getApt(V.selApt);if(!apt)return;
  apt.status=st;
  var idx=DB.apartments.findIndex(function(a){return String(a.id)===String(apt.id);});
  if(idx>-1)DB.apartments[idx]=apt;
  dbSave();renderApt();
  try{await apiPost("upsert_apt",apt);}catch(e){}
};
window.copyRpt=function(id){
  var d=window._rpts&&window._rpts[id];if(!d)return;
  var rpt=makeReport(d.apt,d.bk,d.c,V.bkRptLang);
  navigator.clipboard.writeText(rpt).catch(function(){});
  var btn=event.target.closest("button");
  if(btn){btn.innerHTML=I.check+" "+t("copied");setTimeout(function(){if(btn)btn.innerHTML=I.copy+" "+t("copyRpt");},2000);}
};
window.markPaidOut=async function(id,val){
  var bk=DB.bookings.find(function(b){return b.id===id;});
  if(!bk)return;
  bk.paid_out=val;
  if(val) bk.paid_out_at=new Date().toISOString().slice(0,10);
  var idx=DB.bookings.findIndex(function(b){return b.id===id;});
  if(idx>-1)DB.bookings[idx]=bk;
  dbSave();renderApt();
  try{await apiPost("upsert_booking",bk);}catch(e){}
};
window.editBkBtn=function(id){V.editBk=DB.bookings.find(function(b){return b.id===id;});bkF=null;V.view="bkform";render();};
window.delBkBtn=function(id){if(!confirm("Удалить?"))return;deleteBk(id);};
window.newBkBtn=function(){V.editBk=null;bkF=null;V.view="bkform";render();};

function renderDash(){
  var fil=DB.bookings.filter(function(b){
    if(V.dashFilter.apt!=="all"&&String(b.apartment_id)!==V.dashFilter.apt)return false;
    if(V.dashFilter.month&&(b.check_in||"").slice(0,7)!==V.dashFilter.month)return false;
    return true;
  });
  var usdBks=fil.filter(function(b){return b.income_currency==="USD";});
  var gelBks=fil.filter(function(b){return b.income_currency==="GEL";});
  function tot(arr){return arr.reduce(function(acc,b){var c=calc(b);return{gross:acc.gross+c.gross,net:acc.net+c.net,plat:acc.plat+c.dFin,own:acc.own+c.oFin,netUSD:acc.netUSD+c.netUSD,platUSD:acc.platUSD+c.dFinUSD,ownUSD:acc.ownUSD+c.oFinUSD};},{gross:0,net:0,plat:0,own:0,netUSD:0,platUSD:0,ownUSD:0});}
  var tU=tot(usdBks),tG=tot(gelBks);
  var opts='<option value="all">'+t("analytics")+'</option>'+DB.apartments.map(function(a){return'<option value="'+a.id+'"'+(V.dashFilter.apt===a.id?" selected":"")+'>'+a.apartment_name+'</option>';}).join("");
  var aptRows=DB.apartments.map(function(apt){
    var ab=fil.filter(function(b){return String(b.apartment_id)===String(apt.id);});
    if(!ab.length)return"";
    var uB=ab.filter(function(b){return b.income_currency==="USD";});
    var gB=ab.filter(function(b){return b.income_currency==="GEL";});
    var tUa=tot(uB),tGa=tot(gB);
    return'<div class="card pad" style="margin-bottom:12px">'+
      '<div style="font-size:14px;font-weight:600;margin-bottom:10px">'+apt.apartment_name+'</div>'+
      (uB.length?'<div class="cur-block" style="background:#071020;border:1px solid rgba(253,224,71,.15)"><div class="cur-hdr" style="background:rgba(253,224,71,.06);color:#fde047">USD — '+uB.length+' '+t("stays")+'</div>'+mkCR(t("net"),"$"+fN(tUa.net),"#34d399")+mkCR(t("platform"),"$"+fN(tUa.plat),"#60a5fa")+mkCR(apt.owner_name||t("owner"),"$"+fN(tUa.own),"#34d399")+'</div>':"")+
      (gB.length?'<div class="cur-block" style="background:#071020;border:1px solid rgba(52,211,153,.15)"><div class="cur-hdr" style="background:rgba(52,211,153,.06);color:#6ee7b7">GEL — '+gB.length+' '+t("stays")+'</div>'+mkCR(t("net"),"₾"+fN(tGa.net),"#34d399")+mkCR(t("platform"),"₾"+fN(tGa.plat),"#60a5fa")+mkCR(apt.owner_name||t("owner"),"₾"+fN(tGa.own),"#34d399")+'</div>':"")+
    '</div>';
  }).join("");
  var totalHTML="";
  if(usdBks.length&&gelBks.length){var tNet=tU.netUSD+tG.netUSD;var tPlat=tU.platUSD+tG.platUSD;var tOwn=tU.ownUSD+tG.ownUSD;totalHTML='<div class="total-bar" style="margin-bottom:14px">'+mkCR(t("total")+" (₾"+fN(DB.rate)+")"," ","#fff")+mkCR(t("net"),"$"+fN(tNet),"#34d399")+mkCR(t("platform"),"$"+fN(tPlat),"#60a5fa")+mkCR(t("owner"),"$"+fN(tOwn),"#34d399")+'</div>';}
  return'<div class="field"><select class="sel" onchange="V.dashFilter.apt=this.value;render()">'+opts+'</select></div>'+
    '<div class="field"><input type="month" class="inp" value="'+V.dashFilter.month+'" onchange="V.dashFilter.month=this.value;render()"/></div>'+
    (usdBks.length?'<div class="cur-block" style="background:#0e1f3a;border:1px solid rgba(253,224,71,.2)"><div class="cur-hdr" style="background:rgba(253,224,71,.08);color:#fde047">USD — '+usdBks.length+' '+t("stays")+'</div>'+mkCR(t("arrived"),"$"+fN(tU.gross),"#fff")+mkCR(t("net"),"$"+fN(tU.net),"#34d399")+mkCR(t("platform"),"$"+fN(tU.plat),"#60a5fa")+mkCR(t("owner"),"$"+fN(tU.own),"#34d399")+'</div>':"")+
    (gelBks.length?'<div class="cur-block" style="background:#0e1f3a;border:1px solid rgba(52,211,153,.2)"><div class="cur-hdr" style="background:rgba(52,211,153,.08);color:#6ee7b7">GEL — '+gelBks.length+' '+t("stays")+'</div>'+mkCR(t("arrived"),"₾"+fN(tG.gross),"#fff")+mkCR(t("net"),"₾"+fN(tG.net),"#34d399")+mkCR(t("platform"),"₾"+fN(tG.plat),"#60a5fa")+mkCR(t("owner"),"₾"+fN(tG.own),"#34d399")+'</div>':"")+
    totalHTML+
    (aptRows?'<div class="sec">По квартирам</div>'+aptRows:"")+
    (!fil.length?'<div class="empty">'+t("noBookings")+'</div>':"");
}

/* ══ HAPTIC ════════════════════════════════════════════════════ */
function vibe(){try{if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.HapticFeedback){window.Telegram.WebApp.HapticFeedback.impactOccurred("light");}else if(navigator.vibrate){navigator.vibrate(10);}}catch(e){}}
document.addEventListener("touchstart",function(e){var el=e.target.closest("button,a,.apt-item,.bk-main,.tab,.nav-btn,.plat-btn,.cur-btn,.payer-btn,.lang-btn,.status-btn,.fab");if(el)vibe();},{passive:true});

/* ══ AUTO SYNC ═════════════════════════════════════════════════ */
setInterval(function(){
  if(V.view==="list"||V.view==="apt"){syncFull();}
}, SYNC_INTERVAL);

/* ══ START ═════════════════════════════════════════════════════ */
try{if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}}catch(e){}
render();
syncFull();
</script>
